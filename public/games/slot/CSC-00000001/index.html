<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CELESTIAL SLOT UNIT</title>

  <style>
    :root {
      --theme-accent: #00ffff;
      --theme-bg: #000000;
      --theme-glow: 0 0 10px #00ffff;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* ===== STAGE LAYOUT ===== */
    .stage {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      box-sizing: border-box;
    }

    /* ===== SIDE THUMBS ===== */
    .side {
      width: min(420px, 26vw);
      height: min(900px, 94vh);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.92;
      pointer-events: none;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.75);
      background: rgba(0, 0, 0, 0.25);
    }

    .side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      filter: saturate(1.05) contrast(1.05);
      opacity: 0.80;
      transform: scale(1.02);
    }

    .side::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, rgba(0, 0, 0, 0.00), rgba(0, 0, 0, 0.55));
      z-index: 1;
      pointer-events: none;
    }

    /* ===== VERTICAL SLOT NAME ===== */
    .side-label {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-weight: 900;
      letter-spacing: 0.18em;
      font-size: clamp(22px, 2.6vw, 44px);
      color: rgba(255, 255, 255, 0.12);
      text-shadow:
        0 0 10px rgba(0, 255, 255, 0.30),
        0 0 30px rgba(0, 255, 255, 0.18),
        0 0 60px rgba(0, 0, 0, 0.85);
      user-select: none;
      white-space: nowrap;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.15));
    }

    .side.left .side-label {
      left: 10px;
    }

    .side.right .side-label {
      right: 10px;
    }

    @media (max-width: 1100px) {
      .side {
        display: none;
      }

      .stage {
        gap: 0;
        padding: 0;
      }
    }

    /* ===== GAME CONTAINER ===== */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      aspect-ratio: 9/16;
      background: var(--theme-bg);
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #333;
      overflow: hidden;
    }

    @media (min-aspect-ratio: 9/16) {
      #game-container {
        height: 95vh;
        width: auto;
      }
    }

    /* Screen Area */
    #screen {
      position: relative;
      width: 85%;
      height: 35%;
      margin-top: 15%;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid var(--theme-accent);
      box-shadow: var(--theme-glow), inset 0 0 20px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #reels-container {
      display: flex;
      width: 100%;
      height: 100%;
      justify-content: space-around;
      align-items: center;
    }

    .reel {
      width: 33%;
      height: 100%;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(10, 10, 10, 1);
      position: relative;
      overflow: hidden;
    }

    .reel canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Payline Reference - Center Row Highlight */
    #payline {
      position: absolute;
      top: 33.33%;
      left: 0;
      width: 100%;
      height: 33.33%;
      background: rgba(255, 255, 255, 0.05);
      border-top: 2px solid rgba(255, 0, 0, 0.3);
      border-bottom: 2px solid rgba(255, 0, 0, 0.3);
      pointer-events: none;
      z-index: 5;
    }

    /* UI Panel */
    #ui-panel {
      width: 90%;
      margin-top: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-grow: 1;
    }

    #machine-title {
      color: var(--theme-accent);
      text-shadow: 0 0 5px var(--theme-accent);
      margin: 0;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      order: -1;
      margin-bottom: 10px;
    }

    button {
      border: 1px solid var(--theme-accent);
      background: rgba(0, 50, 50, 0.5);
      color: white;
      padding: 5px 10px;
      font-size: 0.9rem;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      transition: all 0.1s;
      border-radius: 4px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: translateY(2px);
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #555;
      box-shadow: none;
    }

    /* Stop Buttons Row */
    #stop-controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .stop-btn {
      width: 30%;
      height: 50px;
      background: rgba(200, 50, 50, 0.2);
      border-color: #ff4444;
      color: #ffcccc;
      font-weight: bold;
      font-size: 1.0rem;
    }

    .stop-btn:not(:disabled):active {
      background: rgba(255, 0, 0, 0.8);
    }

    /* Main Actions */
    #main-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 80px;
    }

    #spin-btn,
    #seq-stop-btn {
      width: 100%;
      height: 100%;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 8px;
    }

    #spin-btn {
      background: rgba(0, 150, 150, 0.4);
      box-shadow: 0 0 15px var(--theme-accent);
    }

    #spin-btn:not(:disabled) {
      animation: pulse-glow 2s infinite;
    }

    #seq-stop-btn {
      background: rgba(150, 0, 0, 0.4);
      border-color: #ff8888;
      display: none;
      box-shadow: 0 0 15px #ff0000;
    }

    @keyframes pulse-glow {
      0% {
        box-shadow: 0 0 10px var(--theme-accent);
      }

      50% {
        box-shadow: 0 0 25px var(--theme-accent);
      }

      100% {
        box-shadow: 0 0 10px var(--theme-accent);
      }
    }

    /* Buttons Row */
    #meta-controls {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 5px;
      align-items: center;
    }

    .sys-btn {
      padding: 5px 12px;
      font-size: 0.7rem;
      background: rgba(30, 30, 30, 0.5);
      border-color: #666;
      color: #ccc;
      text-decoration: none;
    }

    .sys-btn:hover {
      color: #fff;
      background: rgba(50, 50, 50, 0.8);
      border-color: #888;
    }

    /* PARTNER CARD */
    #partner-section {
      margin-top: auto;
      padding: 15px;
      border: 1px solid var(--theme-accent);
      background: linear-gradient(90deg, rgba(0, 20, 20, 0.8), rgba(0, 40, 40, 0.9));
      cursor: pointer;
      text-align: left;
      position: relative;
      border-radius: 6px;
      transition: transform 0.2s;
    }

    #partner-section:active {
      transform: scale(0.98);
    }

    #partner-label {
      font-size: 0.7rem;
      color: var(--theme-accent);
      letter-spacing: 1px;
      opacity: 0.8;
      margin-bottom: 5px;
    }

    #partner-name {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
    }

    #partner-section::after {
      content: "➜";
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--theme-accent);
      font-size: 1.2rem;
    }

    #celestial-link {
      align-self: flex-end;
      margin-top: 10px;
      margin-bottom: 12px;
    }

    #message-box {
      position: absolute;
      top: 8%;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 1.5rem;
      text-shadow: 0 0 5px #000;
      pointer-events: none;
      z-index: 20;
      font-weight: bold;
    }

    /* init-log */
    #init-log {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.8);
      color: lime;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 10px;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 9999;
      display: none;
      white-space: pre-wrap;
    }

    /* Click layer for quick stop */
    #click-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      display: none;
    }

    /* LUKIA Subtitle */
    #subtitle-lukia {
      margin-top: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #00FFFF;
      text-shadow:
        0 0 2px #FFFFFF,
        0 0 8px #FFFFFF,
        0 0 15px #000000;
      letter-spacing: 2px;
      animation: erotic-pulse 3s ease-in-out infinite;
      font-family: 'Segoe UI', serif;
    }

    @keyframes erotic-pulse {

      0%,
      100% {
        opacity: 0.7;
        text-shadow: 0 0 2px #ea00ff, 0 0 5px #d000ff;
      }

      50% {
        opacity: 1.0;
        text-shadow: 0 0 5px #ea00ff, 0 0 15px #d000ff, 0 0 25px #ff00de;
      }
    }

    /* BGM Toggle Button */
    .bgm-btn {
      margin: 10px auto 0;
      display: block;
      padding: 8px 14px;
      font-size: 12px;
      letter-spacing: 0.08em;
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 255, 0.45);
      background: rgba(0, 0, 0, 0.55);
      color: rgba(0, 255, 255, 0.95);
      cursor: pointer;
      box-shadow: 0 0 14px rgba(0, 255, 255, 0.18);
      transition: all 0.2s ease;
    }

    .bgm-btn:hover {
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.28);
    }

    .bgm-btn.is-off {
      border-color: rgba(255, 0, 255, 0.45);
      color: rgba(255, 0, 255, 0.95);
      box-shadow: 0 0 14px rgba(255, 0, 255, 0.18);
    }

    /* AUTO Toggle */
    .auto-btn {
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 0, 255, 0.45);
      background: rgba(0, 0, 0, 0.55);
      color: rgba(255, 0, 255, 0.95);
      cursor: pointer;
      box-shadow: 0 0 14px rgba(255, 0, 255, 0.18);
      transition: all 0.2s ease;
      min-width: 120px;
      text-align: center;
    }

    .auto-btn.is-on {
      border-color: rgba(0, 255, 255, 0.45);
      color: rgba(0, 255, 255, 0.95);
      box-shadow: 0 0 14px rgba(0, 255, 255, 0.18);
    }

    /* Fever overlay (fixed: never clip) */
    #fever-overlay {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 92%;
      text-align: center;

      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 900;
      color: #fff000;
      text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
      z-index: 60;
      display: none;
      pointer-events: none;

      white-space: normal;
      word-break: break-word;
      line-height: 1.1;
    }

    /* Jackpot overlay (uses thumb image) */
    #jackpot-overlay {
      position: absolute;
      inset: 0;
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, rgba(255, 0, 255, 0.18), rgba(0, 0, 0, 0.88));
      pointer-events: none;
    }

    #jackpot-overlay .card {
      width: min(92%, 520px);
      border: 2px solid rgba(255, 0, 255, 0.55);
      box-shadow: 0 0 22px rgba(255, 0, 255, 0.28), inset 0 0 20px rgba(0, 0, 0, 0.65);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.45);
    }

    #jackpot-overlay img {
      width: 100%;
      height: auto;
      display: block;
      filter: saturate(1.05) contrast(1.05);
    }

    #jackpot-overlay .title {
      padding: 10px 14px;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: rgba(255, 0, 255, 0.95);
      text-shadow: 0 0 10px rgba(255, 0, 255, 0.30);
      font-size: 1.1rem;
      text-align: center;
    }

    /* Fever mode styling */
    .fever-mode #game-container {
      border: 2px solid rgba(255, 0, 255, 0.6);
      box-shadow: 0 0 15px rgba(255, 0, 255, 0.5), inset 0 0 20px rgba(255, 0, 255, 0.4);
      animation: neon-pulse 2.0s infinite alternate;
    }

    .fever-mode .reel {
      background: rgba(40, 0, 40, 0.8);
      border-color: rgba(255, 0, 255, 0.6);
    }

    @keyframes neon-pulse {
      from {
        box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
      }

      to {
        box-shadow: 0 0 25px rgba(255, 0, 255, 0.6), 0 0 5px rgba(255, 255, 255, 0.4);
      }
    }

    /* ===== FEVER FX LAYER (non-UI, temporary overlays) ===== */
    #fx-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 65;
      overflow: hidden;
    }

    .fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    @keyframes fx-scanline {
      0% {
        transform: translateY(-30%);
        opacity: 0.0;
      }

      10% {
        opacity: 1.0;
      }

      100% {
        transform: translateY(30%);
        opacity: 0.0;
      }
    }

    @keyframes fx-shake {

      0%,
      100% {
        transform: translate(0, 0);
      }

      20% {
        transform: translate(-3px, 2px);
      }

      40% {
        transform: translate(3px, -2px);
      }

      60% {
        transform: translate(-2px, -3px);
      }

      80% {
        transform: translate(2px, 3px);
      }
    }

    @keyframes fx-zoom {
      0% {
        transform: scale(1);
        opacity: 0.0;
      }

      15% {
        opacity: 1.0;
      }

      100% {
        transform: scale(1.12);
        opacity: 0.0;
      }
    }

    @keyframes fx-symbolburst {
      0% {
        transform: scale(0.9);
        opacity: 0.0;
        filter: blur(6px);
      }

      20% {
        opacity: 1.0;
        filter: blur(0px);
      }

      100% {
        transform: scale(1.15);
        opacity: 0.0;
        filter: blur(2px);
      }
    }

    @keyframes fx-meteor {
      0% {
        transform: translate(-20%, -20%) rotate(-10deg);
        opacity: 0.0;
      }

      10% {
        opacity: 1.0;
      }

      100% {
        transform: translate(120%, 120%) rotate(20deg);
        opacity: 0.0;
      }
    }

    @keyframes fx-crack {
      0% {
        opacity: 0.0;
        transform: scale(0.98);
      }

      15% {
        opacity: 1.0;
      }

      100% {
        opacity: 0.0;
        transform: scale(1.02);
      }
    }

    /* FX fade in/out (for comfortable visibility) */
    @keyframes fx-fade {
      0% {
        opacity: 0;
        transform: scale(0.985);
        filter: blur(2px);
      }

      25% {
        opacity: 1;
        transform: scale(1.00);
        filter: blur(0px);
      }

      75% {
        opacity: 1;
        transform: scale(1.00);
        filter: blur(0px);
      }

      100% {
        opacity: 0;
        transform: scale(1.015);
        filter: blur(2px);
      }
    }

    .fx-fade {
      animation-name: fx-fade;
      animation-timing-function: ease-in-out;
      animation-fill-mode: both;
    }

    /* --- NEW FX (Additional 8+) --- */

    /* 1. Glitch Pulse */
    @keyframes fx-glitch-anim {
      0% {
        clip-path: inset(40% 0 61% 0);
        transform: translate(-2px, 2px);
        opacity: 1;
      }

      20% {
        clip-path: inset(92% 0 1% 0);
        transform: translate(2px, -3px);
      }

      40% {
        clip-path: inset(43% 0 1% 0);
        transform: translate(-2px, 4px);
      }

      60% {
        clip-path: inset(25% 0 58% 0);
        transform: translate(3px, 1px);
      }

      80% {
        clip-path: inset(54% 0 7% 0);
        transform: translate(-1px, -2px);
      }

      100% {
        clip-path: inset(58% 0 43% 0);
        transform: translate(2px, 2px);
        opacity: 0;
      }
    }

    .fx-glitch {
      animation: fx-glitch-anim 0.35s steps(3) forwards;
      mix-blend-mode: hard-light;
      background: linear-gradient(90deg, rgba(255, 0, 0, 0.2), rgba(0, 255, 0, 0.2), rgba(0, 0, 255, 0.2));
    }

    /* --- EXPANDED 10 FX POOL (CAT 1-10) --- */

    /* Cat 1: Time Freeze (Sepia/Grayscale Flash) */
    @keyframes fx-timefreeze-anim {
      0% {
        filter: sepia(0) grayscale(0);
        transform: scale(1);
      }

      10% {
        filter: sepia(1) grayscale(1) contrast(1.5);
        transform: scale(1.02);
      }

      90% {
        filter: sepia(1) grayscale(1) contrast(1.5);
        transform: scale(1.02);
      }

      100% {
        filter: sepia(0) grayscale(0);
        transform: scale(1);
      }
    }

    .fx-timefreeze {
      background: rgba(255, 240, 200, 0.1);
      backdrop-filter: grayscale(100%) sepia(80%);
      mix-blend-mode: saturation;
      animation: fx-timefreeze-anim 1.2s steps(2) forwards;
    }

    /* Cat 2: Spatial Warp (Perspective Tunnel) */
    @keyframes fx-spatialwarp-anim {
      0% {
        transform: perspective(500px) rotateX(0) scale(1.0);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: perspective(500px) rotateX(180deg) scale(2.5);
        opacity: 0;
      }
    }

    .fx-spatialwarp {
      border: 4px dashed rgba(0, 255, 255, 0.5);
      border-radius: 50%;
      mix-blend-mode: exclusion;
      animation: fx-spatialwarp-anim 0.9s ease-in forwards;
    }

    /* Cat 3: Holy Ray (God Beams) */
    @keyframes fx-holyray-anim {
      0% {
        opacity: 0;
        transform: translateY(100%) scaleX(1);
      }

      20% {
        opacity: 1;
        transform: translateY(0%) scaleX(1.5);
      }

      100% {
        opacity: 0;
        transform: translateY(-50%) scaleX(0.5);
      }
    }

    .fx-holyray {
      background: linear-gradient(0deg, rgba(255, 255, 200, 0) 0%, rgba(255, 255, 220, 0.6) 50%, rgba(255, 255, 200, 0) 100%);
      width: 40%;
      left: 30%;
      mix-blend-mode: screen;
      filter: blur(8px);
      animation: fx-holyray-anim 1.5s ease-out forwards;
    }

    /* Cat 4: Void Crack (Fissure) */
    @keyframes fx-voidcrack-anim {
      0% {
        clip-path: polygon(50% 50%, 50% 50%, 50% 50%);
        opacity: 1;
        background-color: #000;
      }

      100% {
        clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
        opacity: 0;
        background-color: #300;
      }
    }

    .fx-voidcrack {
      mix-blend-mode: multiply;
      animation: fx-voidcrack-anim 0.4s cubic-bezier(0.1, 0.8, 0.1, 1) forwards;
    }

    /* Cat 5: Matrix Rain (Digital Streams) */
    @keyframes fx-matrixrain-anim {
      0% {
        background-position: 0% -100%;
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      100% {
        background-position: 0% 200%;
        opacity: 0;
      }
    }

    .fx-matrixrain {
      background-image: linear-gradient(180deg, rgba(0, 255, 0, 0) 0%, rgba(0, 255, 0, 0.8) 50%, rgba(0, 255, 0, 0) 100%);
      background-size: 100% 50%;
      mix-blend-mode: lighten;
      animation: fx-matrixrain-anim 0.8s linear forwards;
    }

    /* Cat 6: Noise Storm (Heavy Static) */
    @keyframes fx-noisestorm-anim {
      0% {
        opacity: 1;
        transform: translate(0, 0);
      }

      25% {
        opacity: 0.8;
        transform: translate(-5px, 5px);
      }

      50% {
        opacity: 0.9;
        transform: translate(5px, -5px);
      }

      75% {
        opacity: 0.7;
        transform: translate(-5px, -5px);
      }

      100% {
        opacity: 0;
        transform: translate(5px, 5px);
      }
    }

    .fx-noisestorm {
      background: repeating-linear-gradient(90deg, #111 0px, #333 1px, transparent 2px);
      mix-blend-mode: difference;
      opacity: 0.5;
      animation: fx-noisestorm-anim 0.3s steps(4) forwards;
    }

    /* Cat 7: Bio Pulse (Heartbeat) */
    @keyframes fx-biopulse-anim {
      0% {
        box-shadow: inset 0 0 0 0 rgba(255, 0, 0, 0);
        transform: scale(1);
      }

      30% {
        box-shadow: inset 0 0 80px 40px rgba(180, 0, 0, 0.6);
        transform: scale(1.02);
      }

      60% {
        box-shadow: inset 0 0 40px 20px rgba(100, 0, 0, 0.4);
        transform: scale(1.01);
      }

      100% {
        box-shadow: inset 0 0 0 0 rgba(255, 0, 0, 0);
        transform: scale(1);
      }
    }

    .fx-biopulse {
      mix-blend-mode: overlay;
      animation: fx-biopulse-anim 0.9s ease-in-out forwards;
    }

    /* Cat 8: Sonic Boom (Distorted Ripple) */
    @keyframes fx-sonicboom-anim {
      0% {
        transform: scale(0.1);
        border-width: 50px;
        opacity: 1;
      }

      100% {
        transform: scale(1.5);
        border-width: 0px;
        opacity: 0;
      }
    }

    .fx-sonicboom {
      border-radius: 50%;
      border: 10px solid rgba(255, 255, 255, 0.8);
      filter: blur(4px);
      mix-blend-mode: screen;
      animation: fx-sonicboom-anim 0.5s cubic-bezier(0, 0.5, 0.5, 1) forwards;
    }

    /* Cat 9: Color Invert (Hue/Invert Loop) */
    @keyframes fx-colorinvert-anim {
      0% {
        filter: invert(0) hue-rotate(0deg);
      }

      50% {
        filter: invert(1) hue-rotate(180deg);
      }

      100% {
        filter: invert(0) hue-rotate(360deg);
      }
    }

    .fx-colorinvert {
      background: white;
      mix-blend-mode: difference;
      animation: fx-colorinvert-anim 0.4s linear forwards;
    }

    /* Cat 10: Abyssal Gaze (Horror Vignette) */
    @keyframes fx-abyssalgaze-anim {
      0% {
        box-shadow: inset 0 0 0 0 #000;
        opacity: 0;
      }

      40% {
        box-shadow: inset 0 0 150px 100px #000;
        opacity: 1;
      }

      100% {
        box-shadow: inset 0 0 0 0 #000;
        opacity: 0;
      }
    }

    .fx-abyssalgaze {
      mix-blend-mode: multiply;
      animation: fx-abyssalgaze-anim 1.5s ease-in-out forwards;
    }

    /* 2. Halo Ring */
    @keyframes fx-halo-anim {
      0% {
        transform: scale(0.5);
        opacity: 0;
        box-shadow: 0 0 0 0 rgba(0, 255, 255, 0.8);
      }

      30% {
        opacity: 1;
      }

      100% {
        transform: scale(1.6);
        opacity: 0;
        box-shadow: 0 0 50px 20px rgba(0, 255, 255, 0);
      }
    }

    .fx-halo {
      border-radius: 50%;
      border: 4px solid #0ff;
      animation: fx-halo-anim 0.8s ease-out forwards;
      mix-blend-mode: screen;
    }

    /* 3. Time Stop (Flash Invert) */
    @keyframes fx-timestop-anim {
      0% {
        filter: invert(0) brightness(1);
        opacity: 0;
      }

      10% {
        filter: invert(1) brightness(2);
        opacity: 1;
      }

      100% {
        filter: invert(0) brightness(1);
        opacity: 0;
      }
    }

    .fx-timestop {
      background: white;
      animation: fx-timestop-anim 0.4s ease-out forwards;
      mix-blend-mode: difference;
    }

    /* 4. Particles (Star Dust) */
    @keyframes fx-particles-anim {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translateY(150px) scale(0.5);
        opacity: 0;
      }
    }

    .fx-particles {
      background-image:
        radial-gradient(circle, #fff 1px, transparent 1px),
        radial-gradient(circle, #0ff 1px, transparent 1px);
      background-size: 40px 40px, 30px 30px;
      background-position: 0 0, 15px 15px;
      animation: fx-particles-anim 1.2s linear forwards;
      mix-blend-mode: overlay;
    }

    /* 5. Distortion (Skew/Scale) */
    @keyframes fx-distortion-anim {
      0% {
        transform: scale(1) skew(0deg);
        filter: hue-rotate(0deg);
        opacity: 0.8;
      }

      25% {
        transform: scale(1.05) skew(5deg);
        filter: hue-rotate(90deg);
      }

      50% {
        transform: scale(0.95) skew(-5deg);
        filter: hue-rotate(180deg);
      }

      75% {
        transform: scale(1.02) skew(2deg);
        filter: hue-rotate(270deg);
      }

      100% {
        transform: scale(1) skew(0deg);
        filter: hue-rotate(360deg);
        opacity: 0;
      }
    }

    .fx-distortion {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(2px);
      animation: fx-distortion-anim 0.6s ease-in-out forwards;
      mix-blend-mode: exclusion;
    }

    /* 6. Shockwave */
    @keyframes fx-shockwave-anim {
      0% {
        transform: scale(0.2);
        opacity: 1;
        border-width: 20px;
      }

      100% {
        transform: scale(2.0);
        opacity: 0;
        border-width: 0px;
      }
    }

    .fx-shockwave {
      border: 4px solid rgba(255, 0, 255, 0.8);
      border-radius: 50%;
      animation: fx-shockwave-anim 0.7s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
      mix-blend-mode: screen;
    }

    /* 7. Shake Hard */
    @keyframes fx-shake-hard-anim {
      0% {
        transform: translate(0, 0);
      }

      10% {
        transform: translate(-10px, -10px);
      }

      20% {
        transform: translate(10px, 10px);
      }

      30% {
        transform: translate(-10px, 10px);
      }

      40% {
        transform: translate(10px, -10px);
      }

      50% {
        transform: translate(-5px, 0);
      }

      100% {
        transform: translate(0, 0);
      }
    }

    .fx-shake-hard {
      animation: fx-shake-hard-anim 0.4s linear forwards;
    }

    /* 8. Shatter (Clip Path) */
    @keyframes fx-shatter-anim {
      0% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        transform: scale(1);
        opacity: 1;
      }

      50% {
        clip-path: polygon(10% 0, 90% 10%, 100% 90%, 0 100%);
        transform: scale(1.1) rotate(2deg);
      }

      100% {
        clip-path: polygon(20% 20%, 80% 20%, 80% 80%, 20% 80%);
        transform: scale(1.2) rotate(-5deg);
        opacity: 0;
      }
    }

    .fx-shatter {
      background: rgba(255, 255, 255, 0.2);
      mix-blend-mode: screen;
      animation: fx-shatter-anim 0.5s ease-out forwards;
    }

    /* 9. Chromatic Aberration */
    @keyframes fx-chromatic-anim {
      0% {
        text-shadow: 2px 0 red, -2px 0 blue;
        transform: scale(1);
        opacity: 1;
      }

      50% {
        text-shadow: 4px 0 red, -4px 0 blue;
        transform: scale(1.02);
      }

      100% {
        text-shadow: 8px 0 red, -8px 0 blue;
        transform: scale(1.05);
        opacity: 0;
      }
    }

    .fx-chromatic {
      /* Requires text or box-shadow content to be visible really, but we can simulate */
      box-shadow: inset 4px 0 rgba(255, 0, 0, 0.5), inset -4px 0 rgba(0, 0, 255, 0.5);
      animation: fx-chromatic-anim 0.5s ease-out forwards;
      mix-blend-mode: screen;
    }
  </style>
</head>

    async function fetchWithTimeout(resource, timeout = 2000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(resource, { signal: controller.signal });
        clearTimeout(id);
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response;
      } catch (e) {
        clearTimeout(id);
        throw e;
      }
    }

      const endsDecor = s.endsWith("~") || s.endsWith("～");
      if (startsDecor && endsDecor) return s;
      return `~ ${s} ~`;

        if (sub) sub.textContent = safeSubtitle(display);

        if (sub) {
          const raw = sub.textContent.replace(/^[~\s]+|[~\s]+$/g, "");

          sub.textContent = safeSubtitle(raw);

      const ji = document.getElementById('jackpot-img');
      if (ji) ji.src = STATE.profileImageUrl || `assets/thumb/${STATE.slotId}.png`;

    async function loadImages(paths) {
      const loaded = await Promise.all(paths.map(path => new Promise(resolve => {
        const img = new Image();
        img.src = path;
        img.onload = () => resolve(img);
        img.onerror = () => {
          console.warn("Image Load Fail:", path);
          resolve(null);
        };
      })));

      const valid = loaded.filter(Boolean);
      if (valid.length < 3) throw new Error("Not enough valid symbol images");
      STATE.images = valid;

        r.speed = 0;
        r.stopping = false;

      if (STATE.bgmAudio) {

    function setBGMMode(mode) {
      const next =
        (mode === 'FEVER' && STATE.feverType)
          ? bgmFeverSrcByIndex(STATE.feverType.bgmIndex ?? 0)
          : bgmNormalSrc();

      if (!STATE.bgmAudio) return;

      if (STATE.bgmAudio.src && STATE.bgmAudio.src.endsWith(next)) {
        STATE.bgmMode = mode;
        return;
      }

      const wasPlaying = STATE.isBgmPlaying && !STATE.bgmAudio.paused;
      try { STATE.bgmAudio.pause(); } catch (e) { }
      STATE.isBgmPlaying = false;

      STATE.bgmAudio = new Audio(next);
      STATE.bgmAudio.loop = true;
      STATE.bgmAudio.volume = 0.30;
      STATE.bgmMode = mode;

      if (wasPlaying && !STATE.bgmMuted) {
        ensureBGM();
      }

    function fxLayer() { return document.getElementById('fx-layer'); }
    function clearFx() { const layer = fxLayer(); if (layer) layer.innerHTML = ''; }
    function inferAnimMsFromStyle(el) {
      // el.style.animation から "1200ms" / "1.2s" を拾って最大値を返す
      const a = (el && el.style && el.style.animation) ? String(el.style.animation) : '';
      let max = 0;

      // 例: "fx-symbolburst 1200ms ease-in-out 1"
      // 例: "fx-meteor 1.1s ease-in-out 1"
      const re = /([\d.]+)\s*(ms|s)\b/g;
      let m;
      while ((m = re.exec(a)) !== null) {
        const v = Number(m[1]);
        if (!Number.isFinite(v)) continue;
        const ms = (m[2] === 's') ? v * 1000 : v;
        if (ms > max) max = ms;
      }
      return max;
    }

    function addFx(el, ttlMs = 900) {
      const layer = fxLayer();
      if (!layer) return;

      const wrap = document.createElement('div');
      wrap.className = 'fx';

      // ★フェードを確実に当てる（class任せにしない）
      wrap.style.animation = `fx-fade ${ttlMs}ms ease-in-out 1 both`;

      wrap.appendChild(el);
      layer.appendChild(wrap);

      // 最後まで描画させてから消す
      setTimeout(() => { try { wrap.remove(); } catch (e) { } }, ttlMs + 80);
    }

    function pickSymbolImageByType(type) {
      if (!STATE.images.length) return null;

      const useMain = Math.random() < 0.5;

      let mainIndex = 0;
      if (type && type.id) {
        const m = /^SYM(\d+)$/.exec(type.id);
        if (m) mainIndex = Math.max(0, Math.min(8, Number(m[1]) - 1));
      }

      if (useMain) {
        return STATE.images[mainIndex] || STATE.images[0];
      }

      let idx;
      do {
        idx = Math.floor(Math.random() * STATE.images.length);
      } while (idx === mainIndex && STATE.images.length > 1);

      return STATE.images[idx];
    }

    function resetGame() {
      stopFeverFxTicker();
      setAutoEnabled(false);

      STATE.status = 'IDLE';
      STATE.mode = 'NORMAL';
      STATE.feverCount = 0;

      STATE.forcedSymbol = null;
      STATE.forcedLineRows = null;

      STATE.feverType = null;
      STATE.feverSeedSymbol = null;

      document.body.classList.remove('fever-mode');

      hideFeverOverlay();
      hideJackpotOverlay();
      clearFx();

      STATE.reels.forEach(r => {
        r.speed = 0;
        r.stopping = false;
        r.offset = Math.floor(Math.random() * STATE.images.length * SYMBOL_HEIGHT);
      });

      document.getElementById('message-box').textContent = "READY";
      document.getElementById('spin-btn').style.display = 'block';
      document.getElementById('seq-stop-btn').style.display = 'none';
      document.getElementById('spin-btn').disabled = false;

      [0, 1, 2].forEach(i => document.getElementById(`stop-${i}`).disabled = true);
      document.getElementById('click-layer').style.display = 'none';

      setBGMMode('NORMAL');
      applyConfig();
      drawReels();
    }

    function spin() {
      if (!(STATE.status === 'IDLE' || STATE.status === 'RESULT')) return;

      initAudio();
      if (STATE.audioCtx && STATE.audioCtx.state === 'suspended') STATE.audioCtx.resume();
      if (!STATE.bgmMuted) ensureBGM();

      if (STATE.mode === 'FEVER') {
        STATE.feverCount--;
        const label = STATE.feverType ? STATE.feverType.label : "FEVER!!";
        showFeverOverlay(`${label} (${STATE.feverCount})`);
        document.getElementById('message-box').textContent = `FEVER! ${STATE.feverCount} LEFT`;
        ensureFeverFX();
      } else {
        hideFeverOverlay();
        clearFx();
        document.getElementById('message-box').textContent = "SPINNING...";
      }

      playTone('spin');

      STATE.status = 'SPINNING';
      STATE.forcedSymbol = null;
      STATE.forcedLineRows = null;

      const c = currentConfig();
      let currentWinRate = (c.winRate ?? DEFAULTS.winRate);

      if (STATE.mode === 'FEVER') {
        currentWinRate = 1.0; // FEVERは気持ちよく
      }

      const willWin = Math.random() < currentWinRate;
      if (willWin) {
        const symCount = STATE.images.length;
        STATE.forcedSymbol = Math.floor(Math.random() * symCount);

        // 5ラインのどれかで当てる
        STATE.forcedLineRows = PAYLINES_5[Math.floor(Math.random() * PAYLINES_5.length)];
      }

      document.getElementById('spin-btn').style.display = 'none';
      document.getElementById('seq-stop-btn').style.display = 'block';
      document.getElementById('seq-stop-btn').disabled = false;
      document.getElementById('click-layer').style.display = 'block';
      [0, 1, 2].forEach(i => document.getElementById(`stop-${i}`).disabled = false);

      STATE.reels.forEach(r => {
        r.speed = 40 + Math.random() * 5;
        r.stopping = false;
      });

      scheduleAutoStops();
    }

    function stopReel(idx) {
      if (STATE.status !== 'SPINNING') return;
      const r = STATE.reels[idx];
      if (r.speed > 0 && !r.stopping) {
        r.stopping = true;
        playTone('stop');
        document.getElementById(`stop-${idx}`).disabled = true;
      }
    }

    function stopNext() {
      const idx = STATE.reels.findIndex(r => r.speed > 0 && !r.stopping);
      if (idx !== -1) stopReel(idx);
    }

    function renderLoop() {
      updatePhysics();
      drawReels();
      requestAnimationFrame(renderLoop);
    }

    function updatePhysics() {
      if (STATE.status !== 'SPINNING') return;

      let moving = 0;
      const totalH = STATE.images.length * SYMBOL_HEIGHT;

      STATE.reels.forEach((r, reelIdx) => {
        if (r.speed > 0) {
          moving++;
          r.offset += r.speed;
          if (r.offset >= totalH) r.offset -= totalH;

          if (r.stopping) {
            let targetIdx = 0;

            if (STATE.forcedSymbol !== null) {
              // そのリールが狙う段(row)：上0 / 中1 / 下2（未指定なら中）
              const row = (STATE.forcedLineRows && STATE.forcedLineRows[reelIdx] != null)
                ? STATE.forcedLineRows[reelIdx]
                : 1;

              // top + row = forcedSymbol => top = forcedSymbol - row
              let desiredTop = STATE.forcedSymbol - row;
              const n = STATE.images.length;
              while (desiredTop < 0) desiredTop += n;
              desiredTop = desiredTop % n;

              targetIdx = desiredTop;
            } else {
              const currentIndex = Math.floor(r.offset / SYMBOL_HEIGHT);
              targetIdx = (currentIndex + 1) % STATE.images.length;
            }

            const targetOffset = targetIdx * SYMBOL_HEIGHT;
            r.offset = targetOffset;
            r.speed = 0;
            r.stopping = false;
            r.symbolIndex = targetIdx;
          }
        }
      });

      if (moving === 0) {
        STATE.status = 'RESULT';
        checkResult();
      }
    }

    function checkResult() {
      document.getElementById('click-layer').style.display = 'none';
      document.getElementById('seq-stop-btn').style.display = 'none';
      document.getElementById('spin-btn').style.display = 'block';
      document.getElementById('spin-btn').disabled = false;

      const conf = currentConfig();
      const feverConf = conf.fever || DEFAULTS.fever;

      const win = detectWinLine();

      if (win) {
        playTone('win');

        // ===== FEVER LOOP (config-driven) =====
        if (STATE.mode === 'FEVER') {
          const conf = currentConfig();
          const loop = (conf.fever && conf.fever.loop) ? conf.fever.loop : null;

          if (loop && loop.enabled) {
            const chance = Number(loop.chance ?? 0);
            const add = Number(loop.addSpins ?? 0);
            const max = Number(loop.maxSpins ?? 999);

            if (add > 0 && Math.random() < chance) {
              STATE.feverCount = Math.min(max, STATE.feverCount + add);

              // 表示更新（FEVER表記を今の残り回数に追従）
              const label = STATE.feverType ? STATE.feverType.label : "FEVER!!";
              showFeverOverlay(`${label} (${STATE.feverCount})`);
              document.getElementById('message-box').textContent = `FEVER EXTEND! +${add}`;
            }
          }
        }

        const winSymbol = win.symbol; // 0..8
        const jackpotSymbol = 0;      // SYM1 をジャックポット扱い（現行仕様）

        const isJackpot = (winSymbol === jackpotSymbol);

        if (isJackpot) {
          showJackpotOverlay(1000);
          if (feverConf.enabled) {
            // ★FEVER中はタイプを上書きしない（SYM1に奪われるのを防ぐ）
            if (STATE.mode === 'NORMAL') {
              startFever(true, winSymbol);
            } else {
              document.getElementById('message-box').textContent = "JACKPOT!";
              // FEVER中の当たり演出は通常のFEVER演出強化だけ
              runRandomFeverWinFX();
            }
          } else {
            document.getElementById('message-box').textContent = "JACKPOT!";
          }
        } else {
          const startOnAnyWin = (feverConf.startOnAnyWin || { enabled: true, rate: 0.12 });
          const willFever = feverConf.enabled && !!startOnAnyWin.enabled && (Math.random() < Number(startOnAnyWin.rate ?? 0.12));

          if (willFever && STATE.mode === 'NORMAL') {
            startFever(false, winSymbol);
          } else {
            document.getElementById('message-box').textContent = "VITALIZATION!";
          }
        }

      } else {
        if (STATE.mode === 'NORMAL') {
          document.getElementById('message-box').textContent = "TRY AGAIN";
        } else {
          document.getElementById('message-box').textContent = "";
        }
        hideJackpotOverlay();
      }

      if (STATE.mode === 'FEVER' && STATE.feverCount <= 0) {
        setTimeout(endFever, 900);
      }

      if (STATE.autoEnabled) {
        const base = currentConfig().autoSpin || {};
        const delay = (STATE.mode === 'FEVER')
          ? Number(base.feverIntervalMs ?? 650)
          : Number(base.intervalMs ?? 1100);
        scheduleNextAutoSpin(delay);
      }
    }

    function startFever(fromJackpot, symbolIdx0to8 = 0) {
      const type = pickFeverTypeFromWinSymbol(symbolIdx0to8);
      STATE.feverType = type;
      STATE.feverSeedSymbol = symbolIdx0to8;

      STATE.mode = 'FEVER';
      STATE.feverCount = Number(type.spins ?? (currentConfig().fever?.spinsDefault ?? 25));

      document.body.classList.add('fever-mode');

      const label = type.label || "FEVER!!";
      showFeverOverlay(`${label} (${STATE.feverCount})`);

      document.getElementById('message-box').textContent = fromJackpot ? "JACKPOT FEVER!!" : label;

      setBGMMode('FEVER');
      runFeverEffects(type);
      startFeverFxTicker();
    }

    function endFever() {
      stopFeverFxTicker();
      STATE.mode = 'NORMAL';
      document.body.classList.remove('fever-mode');
      hideFeverOverlay();
      clearFx();
      document.getElementById('message-box').textContent = "READY";

      STATE.feverType = null;
      STATE.feverSeedSymbol = null;
      setBGMMode('NORMAL');
    }

    function showFeverOverlay(text) {
      const overlay = document.getElementById('fever-overlay');
      overlay.textContent = text || "FEVER!!";
      overlay.style.display = 'block';
    }

    function hideFeverOverlay() {
      const overlay = document.getElementById('fever-overlay');
      overlay.style.display = 'none';
    }

    function showJackpotOverlay(duration = 1500) {
      const el = document.getElementById('jackpot-overlay');
      const img = document.getElementById('jackpot-img');
      if (img) img.src = STATE.profileImageUrl || `assets/thumb/${STATE.slotId}.png`;

      el.style.display = 'flex';
      setTimeout(() => {
        hideJackpotOverlay();
      }, duration);
    }

    function hideJackpotOverlay() {
      const el = document.getElementById('jackpot-overlay');
      el.style.display = 'none';
    }

    function drawReels() {
      const total = STATE.images.length;
      STATE.reels.forEach(r => {
        const ctx = r.ctx;
        if (!ctx) return;

        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        const baseIdx = Math.floor(r.offset / SYMBOL_HEIGHT);
        const shiftY = -(r.offset % SYMBOL_HEIGHT);

        for (let i = -1; i < 4; i++) {
          let idx = (baseIdx + i) % total;
          if (idx < 0) idx += total;

          const img = STATE.images[idx];
          const y = shiftY + (i * SYMBOL_HEIGHT);
          if (!img) continue;

          try {
            const side = Math.min(img.width, img.height);
            const sx = (img.width - side) / 2;
            const sy = (img.height - side) / 2;
            ctx.drawImage(img, sx, sy, side, side, 0, y, CANVAS_WIDTH, SYMBOL_HEIGHT);
          } catch (e) {
            ctx.fillStyle = '#f00';
            ctx.fillRect(0, y, CANVAS_WIDTH, SYMBOL_HEIGHT);
          }
        }
      });
    }

    // ===== SFX (synth) =====
    function playTone(type) {
      if (!STATE.audioCtx) return;

      const ctx = STATE.audioCtx;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.connect(gain);
      gain.connect(ctx.destination);

      const now = ctx.currentTime;

      if (type === 'spin') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(VOLUMES.SPIN, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'stop') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        gain.gain.setValueAtTime(VOLUMES.STOP, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'win') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        osc.frequency.setValueAtTime(1046.50, now + 0.3);

        gain.gain.setValueAtTime(VOLUMES.WIN, now);
        gain.gain.linearRampToValueAtTime(VOLUMES.WIN, now + 0.4);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 1.0);

        osc.start(now);
        osc.stop(now + 1.0);
      }
    }

    // ===== BOOT =====
    async function boot() {
      log("BOOT SEQUENCE STARTED...");

      mountThumbAndProfile();

      try {
        STATE.config = EMBEDDED_CONFIG;
        log("Config loaded (embedded).");
      } catch (e) {
        STATE.config = DEFAULTS;
        log("Config failed (" + (e && e.name ? e.name : "ERR") + "). Using Defaults.");
      }

      applyConfig();

      try {
        await loadImages(AUTO_SYMBOLS);
        log("Images loaded.");
      } catch (e) {
        log("Images failed. Check assets/slotimages/01_symbol.png...09_symbol.png");
        console.error(e);
      }

      initReels();
      setupInteractions();
      setupBgmToggle();
      setupAutoToggle();

      log("SYSTEM READY.");
      requestAnimationFrame(renderLoop);
    }

    window.onload = boot;
  </script>
