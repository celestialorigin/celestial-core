<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CELESTIAL SLOT UNIT</title>

  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --vh: 1vh;

      --theme-accent: #00ffff;
      --theme-bg: #000000;
      --theme-glow: 0 0 10px #00ffff;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100svh;
    }

    /* ===== STAGE LAYOUT ===== */
    .stage {
      width: 100%;
      min-height: calc(var(--vh, 1vh) * 100);
      min-height: 100svh;
      min-height: 100dvh;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: calc(24px + var(--safe-top)) 24px calc(24px + var(--safe-bottom));
      box-sizing: border-box;
      overflow-x: hidden;
    }

    /* ===== SIDE THUMBS ===== */
    .side {
      width: min(420px, 26vw);
      height: min(900px, 94vh);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.92;
      pointer-events: none;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.75);
      background: rgba(0, 0, 0, 0.25);
    }

    .side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      filter: saturate(1.05) contrast(1.05);
      opacity: 0.80;
      transform: scale(1.02);
    }

    .side::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, rgba(0, 0, 0, 0.00), rgba(0, 0, 0, 0.55));
      z-index: 1;
      pointer-events: none;
    }

    .side::after {
      content: "";
      position: absolute;
      inset: -2px;
      border: 2px solid rgba(0, 255, 255, 0.20);
      border-radius: 12px;
      box-shadow: 0 0 24px rgba(0, 255, 255, 0.16);
      z-index: 2;
      pointer-events: none;
    }

    .side-label {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 0.18em;
      font-weight: 800;
      font-size: 36px;
      line-height: 1;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.06);
      text-shadow: 0 0 18px rgba(255, 0, 255, 0.18), 0 0 28px rgba(0, 255, 255, 0.14);
      z-index: 3;
      pointer-events: none;
      user-select: none;
      mix-blend-mode: screen;
    }

    .side.left .side-label { left: 14px; }
    .side.right .side-label { right: 14px; }

    /* ===== GAME CONTAINER ===== */
    #game-container {
      width: 420px;
      max-width: 92vw;
      aspect-ratio: 9 / 16;
      background: #000;
      border: 2px solid var(--theme-accent);
      box-shadow: 0 0 25px var(--theme-accent);
      border-radius: 12px;
      padding: 14px;
      box-sizing: border-box;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    #init-log {
      position: absolute;
      top: calc(10px + var(--safe-top));
      left: 14px;
      right: 14px;
      background: rgba(0, 0, 0, 0.55);
      color: #00ff6a;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.35;
      padding: 8px 10px;
      border: 1px solid rgba(0, 255, 255, 0.35);
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.25);
      border-radius: 8px;
      white-space: pre-line;
      z-index: 50;
      pointer-events: none;
      user-select: none;
    }

    #machine-title {
      text-align: center;
      margin: 54px 0 10px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--theme-accent);
      text-shadow: 0 0 10px var(--theme-accent), 0 0 18px rgba(255, 0, 255, 0.45);
    }

    #message-box {
      position: absolute;
      top: 112px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      font-weight: 900;
      text-shadow: 0 0 12px rgba(0, 255, 255, 0.8), 0 0 18px rgba(255, 0, 255, 0.45);
      color: #fff;
      z-index: 40;
      pointer-events: none;
      opacity: 0.0;
      transition: opacity .25s ease;
    }

    #fever-overlay {
      position: absolute;
      top: 104px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 30px;
      font-weight: 1000;
      letter-spacing: 1px;
      text-shadow: 0 0 18px rgba(255, 0, 255, 0.55), 0 0 22px rgba(255, 255, 0, 0.45);
      color: rgba(255, 255, 255, 0.0);
      z-index: 41;
      pointer-events: none;
      opacity: 0.0;
      transition: opacity .25s ease;
    }

    /* ===== SCREEN / REELS ===== */
    #screen {
      width: 100%;
      border: 2px solid var(--theme-accent);
      box-shadow: 0 0 14px rgba(0, 255, 255, 0.65);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      margin-top: 8px;
      height: 380px;
      background: #000;
    }

    #reels-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .reel {
      flex: 1;
      border-left: 1px solid rgba(0, 255, 255, 0.25);
      border-right: 1px solid rgba(0, 255, 255, 0.25);
      overflow: hidden;
      background: #000;
      position: relative;
    }

    .reel canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #payline {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 2px;
      background: rgba(255, 255, 0, 0.9);
      box-shadow: 0 0 12px rgba(255, 255, 0, 0.75);
      transform: translateY(-1px);
      pointer-events: none;
      z-index: 10;
      opacity: 0.65;
    }

    /* FX Layer */
    #fx-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 12;
      overflow: hidden;
    }

    #click-layer {
      position: absolute;
      inset: 0;
      z-index: 11;
      background: rgba(0, 0, 0, 0.0);
    }

    /* JACKPOT CUTIN */
    #jackpot-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    #jackpot-overlay .card {
      width: min(92%, 380px);
      border: 2px solid rgba(255, 255, 0, 0.75);
      border-radius: 14px;
      box-shadow: 0 0 40px rgba(255, 255, 0, 0.45), 0 0 60px rgba(255, 0, 255, 0.25);
      overflow: hidden;
      background: rgba(10, 0, 12, 0.9);
      transform: translateY(6px) scale(0.98);
      animation: jackpotIn 280ms ease forwards;
    }

    #jackpot-overlay img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      filter: saturate(1.1) contrast(1.05);
    }

    #jackpot-overlay .title {
      padding: 12px 14px 14px;
      font-weight: 1000;
      text-align: center;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 0 0 14px rgba(255, 255, 0, 0.45), 0 0 20px rgba(255, 0, 255, 0.35);
    }

    @keyframes jackpotIn {
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* ===== UI PANEL ===== */
    #ui-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
      flex-grow: 1;
      justify-content: flex-start;
    }

    #stop-controls {
      display: flex;
      gap: 8px;
    }

    .stop-btn {
      flex: 1;
      height: 50px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(0, 255, 255, 0.35);
      color: rgba(255, 255, 255, 0.85);
      border-radius: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 14px rgba(0, 255, 255, 0.15);
    }

    .stop-btn:active {
      transform: translateY(1px);
    }

    #main-controls {
      width: 100%;
      display: flex;
      gap: 8px;
      height: 80px;
    }

    #spin-btn,
    #seq-stop-btn {
      flex: 1;
      background: linear-gradient(90deg, rgba(0, 255, 255, 0.22), rgba(255, 0, 255, 0.24));
      border: 1px solid rgba(0, 255, 255, 0.6);
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.28), 0 0 18px rgba(255, 0, 255, 0.25);
      color: #fff;
      border-radius: 12px;
      font-weight: 1000;
      letter-spacing: 1px;
      font-size: 30px;
      position: relative;
      overflow: hidden;
    }

    #spin-btn:active,
    #seq-stop-btn:active {
      transform: translateY(1px);
    }

    #spin-subtitle {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 6px;
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 0 12px rgba(255, 0, 255, 0.55), 0 0 14px rgba(0, 255, 255, 0.35);
      pointer-events: none;
    }

    #music-controls {
      width: 100%;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }

    .sys-btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(0, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 0 16px rgba(0, 255, 255, 0.18);
    }

    .sys-btn:active { transform: translateY(1px); }

    #sub-controls {
      width: 100%;
      display: flex;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
    }

    #partner-section {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 255, 0.28);
      background: rgba(0, 0, 0, 0.20);
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.16);
      cursor: pointer;
      user-select: none;
    }

    #partner-section:hover {
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.22), 0 0 24px rgba(255, 0, 255, 0.10);
      border-color: rgba(0, 255, 255, 0.45);
    }

    #partner-section .left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    #partner-section .cap {
      font-size: 12px;
      opacity: 0.8;
      color: rgba(255, 255, 255, 0.85);
    }

    #partner-section .name {
      font-size: 18px;
      font-weight: 1000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 12px rgba(0, 255, 255, 0.35);
    }

    #partner-section .arrow {
      font-size: 28px;
      font-weight: 1000;
      color: rgba(0, 255, 255, 0.95);
      text-shadow: 0 0 14px rgba(0, 255, 255, 0.45);
      flex: 0 0 auto;
    }

    #celestial-link {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* ===== FEVER MODE ===== */
    .fever-mode #fever-overlay {
      opacity: 1;
      color: rgba(255, 255, 255, 1);
    }

    /* Anti-Dazzle overrides (FEVER) */
    .fever-mode #flash-overlay { display: none !important; }
    .fever-mode .reel { animation: none !important; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1100px) {
      .side { display: none; }
      .stage { padding: calc(18px + var(--safe-top)) 18px calc(18px + var(--safe-bottom)); }
    }

    /* ==============================
       MOBILE: Make reel screen bigger (FIX)
       ============================== */
@media (max-width: 640px) {

      /* 9/16固定で縮むのを殺す（既存踏襲） */
      #game-container{
        width: 100vw !important;
        max-width: 100vw !important;
        height: calc((var(--vh, 1vh) * 100) - var(--safe-top) - var(--safe-bottom)) !important;
        max-height: none !important;
        aspect-ratio: auto !important;
        border-radius: 0;

        /* ★ここが本命：flex→grid にして “上＝screen / 下＝ui” を固定 */
        display: grid !important;
        grid-template-rows: auto 1fr;
        align-items: stretch;
      }

      /* ★screen を「スマホ表示の主役」にする */
      #screen{
        width: min(96vw, 680px);
        margin-top: clamp(6px, 1.6svh, 14px);

        /* ここを上げるほど絵柄がデカくなる */
        height: clamp(420px, 60svh, 720px);
      }

      #reels-container { height: 100%; }

      /* ★UIは “維持” しつつ、食いすぎないようにする */
      #ui-panel{
        width: 94%;
        margin: 10px auto 0;
        gap: 10px;

        /* grid下段で “余り” を使う。足りなければスクロール */
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;

        padding-bottom: max(14px, var(--safe-bottom));
      }

      /* タイトル周りを少しだけ詰める（見た目維持） */
      #machine-title{
        margin-bottom: 6px;
        font-size: 1.05rem;
      }

      /* ボタンサイズは “最低限” 維持しつつ微調整 */
      #main-controls { height: 72px; }
      .stop-btn { height: 46px; }
      #spin-btn, #seq-stop-btn { font-size: 1.35rem; }

      /* 下のカードがデカいので、気持ち詰める（UI維持） */
      #partner-section { padding: 12px; }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="side left">
      <img id="side-thumb-left" alt="slot thumb">
      <div class="side-label" id="side-label-left"></div>
    </div>

    <div id="game-container">
      <div id="init-log"></div>
      <div id="message-box">READY</div>
      <div id="fever-overlay">FEVER!!</div>

      <div id="screen">
        <div id="reels-container">
          <div class="reel" id="reel0"><canvas width="256" height="768"></canvas></div>
          <div class="reel" id="reel1"><canvas width="256" height="768"></canvas></div>
          <div class="reel" id="reel2"><canvas width="256" height="768"></canvas></div>
        </div>
        <div id="payline"></div>

        <!-- FX LAYER (FEVER effects) -->
        <div id="fx-layer"></div>

        <div id="click-layer"></div>

        <!-- JACKPOT CUTIN (uses thumb/{slotId}.png) -->
        <div id="jackpot-overlay">
          <div class="card">
            <img id="jackpot-img" alt="JACKPOT">
            <div class="title">JACKPOT VITALIZATION</div>
          </div>
        </div>
      </div>

      <h2 id="machine-title">CELESTIAL SLOT UNIT</h2>

      <div id="ui-panel">
        <div id="stop-controls">
          <button class="stop-btn" id="stop0">STOP L</button>
          <button class="stop-btn" id="stop1">STOP C</button>
          <button class="stop-btn" id="stop2">STOP R</button>
        </div>

        <div id="main-controls">
          <button id="spin-btn">
            SPIN <span id="spin-count">(0)</span>
            <div id="spin-subtitle">~VRCなる箱 SLOT ver~</div>
          </button>
          <button id="seq-stop-btn" style="display:none;">STOP</button>
        </div>

        <div id="music-controls">
          <button class="sys-btn" id="music-btn">▶︎ MUSIC START</button>
          <button class="sys-btn" id="music-stop-btn">⏸ MUSIC STOP</button>
        </div>

        <div id="sub-controls">
          <button class="sys-btn" id="auto-btn">AUTO: OFF</button>
          <button class="sys-btn" id="reset-btn">RESET SYSTEM</button>
        </div>

        <div id="partner-section" role="button" tabindex="0" aria-label="partner link">
          <div class="left">
            <div class="cap">コラボ・提供者の方のページへ</div>
            <div class="name" id="partner-name">VRCなる箱さんのページへ</div>
          </div>
          <div class="arrow">→</div>
        </div>

        <div id="celestial-link">
          <button class="sys-btn" id="celestial-btn">CELESTIAL WEB SITE</button>
        </div>
      </div>

      <!-- flash overlay (kept, but disabled in fever-mode via CSS) -->
      <div id="flash-overlay" style="position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:90;"></div>
    </div>

    <div class="side right">
      <img id="side-thumb-right" alt="slot thumb">
      <div class="side-label" id="side-label-right"></div>
    </div>
  </div>

  <script>
    /* ==============================
       SLOT ENGINE (single-file, embedded config)
       ============================== */

    // ----- Embedded config (no fetch required) -----
    const EMBEDDED_CONFIG = {
      "machineTitle": "CELESTIAL SLOT UNIT",
      "partnerLabel": "コラボ・提供者の方のページへ",
      "partnerName": "VRCなる箱さんのページへ",
      "partnerUrl": "https://x.com/",
      "celestialUrl": "https://celestial-observers.com/",
      "celestialButtonLabel": "CELESTIAL WEB SITE",
      "theme": { "accent": "#00ffff", "bg": "#000000" },

      "winRate": 0.16,

      "jackpot": {
        "enabled": true,
        "symbolId": "SYM1"
      },

      "fever": {
        "enabled": true,
        "startRate": 0.10,
        "spins": 25,
        "loop": { "chance": 0.35, "addSpins": 3 }
      },

      "feverTypes": [
        {
          "id": "SYM4",
          "label": "SYMBOL-4 FEVER",
          "priority": 10,
          "bgm": "assets/audio/bgm_fever.wav",
          "ambientFx": ["scanline", "neonFrame"],
          "winFx": ["burst", "tripleZoom", "splitPanels", "roulette"]
        }
      ],

      "audio": {
        "bgmNormal": "assets/audio/bgm_normal.wav",
        "bgmFever": "assets/audio/bgm_fever.wav",
        "win": { "volume": 0.10 },
        "start": { "volume": 0.08 }
      }
    };

    // ----- Embedded symbols list -----
    const EMBEDDED_SYMBOLS = {
      "symbols": [
        "assets/slotimages/01_symbol.png",
        "assets/slotimages/02_symbol.png",
        "assets/slotimages/03_symbol.png",
        "assets/slotimages/04_symbol.png",
        "assets/slotimages/05_symbol.png",
        "assets/slotimages/06_symbol.png",
        "assets/slotimages/07_symbol.png",
        "assets/slotimages/08_symbol.png",
        "assets/slotimages/09_symbol.png"
      ]
    };

    // ----- Utils -----
    const $ = (sel) => document.querySelector(sel);

    function logBoot(line) {
      const el = $("#init-log");
      if (!el) return;
      el.textContent = (el.textContent ? el.textContent + "\n" : "") + line;
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

    function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

    // ----- Slot ID (for thumb auto load) -----
    function getSlotIdFromPath() {
      const p = location.pathname.replace(/\/+$/, "");
      // expect .../games/slot/CS-001
      const m = p.match(/\/(CS-\d{3})$/i);
      return m ? m[1].toUpperCase() : "CS-001";
    }

    const SLOT_ID = getSlotIdFromPath();

    // ----- Theme apply -----
    function applyTheme(cfg) {
      const accent = cfg?.theme?.accent || "#00ffff";
      const bg = cfg?.theme?.bg || "#000000";
      document.documentElement.style.setProperty("--theme-accent", accent);
      document.documentElement.style.setProperty("--theme-bg", bg);
      document.documentElement.style.setProperty("--theme-glow", `0 0 10px ${accent}`);
      document.body.style.backgroundColor = bg;
      $("#machine-title").textContent = cfg.machineTitle || "CELESTIAL SLOT UNIT";
      $("#partner-name").textContent = cfg.partnerName || "Partner";
      $("#celestial-btn").textContent = cfg.celestialButtonLabel || "CELESTIAL WEB SITE";
      $("#partner-section .cap").textContent = cfg.partnerLabel || "コラボ・提供者の方のページへ";
    }

    // ----- Side thumbs -----
    function initSideThumbs() {
      const left = $("#side-thumb-left");
      const right = $("#side-thumb-right");
      const leftLabel = $("#side-label-left");
      const rightLabel = $("#side-label-right");

      const labelText = SLOT_ID;
      if (leftLabel) leftLabel.textContent = labelText;
      if (rightLabel) rightLabel.textContent = labelText;

      const src = `/wip/games/celestial-slot/thumbs/${SLOT_ID}.png`;
      if (left) left.src = src;
      if (right) right.src = src;
    }

    // ----- State -----
    const STATE = {
      config: null,
      symbols: [],
      images: [],
      reels: [
        { offset: 0, speed: 0, stopping: false, stopAt: null },
        { offset: 0, speed: 0, stopping: false, stopAt: null },
        { offset: 0, speed: 0, stopping: false, stopAt: null },
      ],
      status: "IDLE", // IDLE | SPINNING | STOPPING
      mode: "NORMAL", // NORMAL | FEVER
      spinsLeft: 0,
      auto: false,
      forcedSymbolIndex: null,
      currentFeverType: null,
      audioReady: false,
      bgm: null,
      bgmCtx: null,
      bgmSource: null,
      bgmGain: null,
      lastTick: performance.now()
    };

    const UI = {
      msg: $("#message-box"),
      fever: $("#fever-overlay"),
      spinCount: $("#spin-count"),
      spinBtn: $("#spin-btn"),
      seqStopBtn: $("#seq-stop-btn"),
      stopBtns: [$("#stop0"), $("#stop1"), $("#stop2")],
      autoBtn: $("#auto-btn"),
      resetBtn: $("#reset-btn"),
      partnerSection: $("#partner-section"),
      celestialBtn: $("#celestial-btn"),
      musicBtn: $("#music-btn"),
      musicStopBtn: $("#music-stop-btn"),
      fxLayer: $("#fx-layer"),
      jackpotOverlay: $("#jackpot-overlay"),
      jackpotImg: $("#jackpot-img"),
      flashOverlay: $("#flash-overlay")
    };

    // ----- Canvas -----
    const CANVASES = [
      document.querySelector("#reel0 canvas"),
      document.querySelector("#reel1 canvas"),
      document.querySelector("#reel2 canvas")
    ];
    const CTX = CANVASES.map(c => c.getContext("2d"));

    const SYMBOL_W = 256;
    const SYMBOL_H = 256;
    const VISIBLE = 3;

    function showMsg(text, ms = 900) {
      if (!UI.msg) return;
      UI.msg.textContent = text;
      UI.msg.style.opacity = "1";
      clearTimeout(showMsg._t);
      showMsg._t = setTimeout(() => { UI.msg.style.opacity = "0"; }, ms);
    }

    function setFeverLabel(text, on) {
      if (!UI.fever) return;
      UI.fever.textContent = text || "FEVER!!";
      UI.fever.style.opacity = on ? "1" : "0";
    }

    function updateSpinCount() {
      if (!UI.spinCount) return;
      UI.spinCount.textContent = `(${STATE.spinsLeft})`;
    }

    // ----- Image loading -----
    function loadImages(paths) {
      return Promise.all(paths.map((p) => new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = p;
      })));
    }

    function createDummySymbols(n = 9) {
      const dummy = [];
      for (let i = 0; i < n; i++) {
        const c = document.createElement("canvas");
        c.width = SYMBOL_W;
        c.height = SYMBOL_H;
        const g = c.getContext("2d");
        g.fillStyle = `hsl(${(i * 40) % 360} 80% 35%)`;
        g.fillRect(0, 0, SYMBOL_W, SYMBOL_H);
        g.fillStyle = "rgba(255,255,255,0.85)";
        g.font = "900 72px ui-monospace, Menlo, Consolas, monospace";
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.fillText(`SYM${i + 1}`, SYMBOL_W / 2, SYMBOL_H / 2);
        dummy.push(c);
      }
      return dummy;
    }

    // ----- Drawing -----
    function drawReel(idx) {
      const ctx = CTX[idx];
      const reel = STATE.reels[idx];
      const images = STATE.images;
      const n = images.length || 9;

      ctx.clearRect(0, 0, SYMBOL_W, SYMBOL_H * VISIBLE);

      const topIndex = ((Math.floor(reel.offset / SYMBOL_H) % n) + n) % n;
      const yOffset = -(reel.offset % SYMBOL_H);

      for (let row = 0; row < VISIBLE + 1; row++) {
        const si = (topIndex + row) % n;
        const img = images[si];
        const y = yOffset + row * SYMBOL_H;

        if (img) {
          ctx.drawImage(img, 0, 0, SYMBOL_W, SYMBOL_H, 0, y, SYMBOL_W, SYMBOL_H);
        } else {
          ctx.fillStyle = "#222";
          ctx.fillRect(0, y, SYMBOL_W, SYMBOL_H);
        }
      }

      // glossy overlay
      const grad = ctx.createLinearGradient(0, 0, SYMBOL_W, 0);
      grad.addColorStop(0, "rgba(255,255,255,0.10)");
      grad.addColorStop(0.5, "rgba(255,255,255,0.00)");
      grad.addColorStop(1, "rgba(255,255,255,0.10)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, SYMBOL_W, SYMBOL_H * VISIBLE);
    }

    function render() {
      for (let i = 0; i < 3; i++) drawReel(i);
    }

    // ----- Physics -----
    function update(dt) {
      const speedBase = STATE.mode === "FEVER" ? 2100 : 1600;
      for (let i = 0; i < 3; i++) {
        const r = STATE.reels[i];
        if (STATE.status === "SPINNING") {
          r.offset += speedBase * dt;
        } else if (STATE.status === "STOPPING") {
          if (!r.stopping) continue;

          r.offset += speedBase * dt;

          // snap when close to stopAt
          if (r.stopAt != null) {
            const diff = r.stopAt - r.offset;
            if (Math.abs(diff) < 60) {
              r.offset = r.stopAt;
              r.stopping = false;
              r.stopAt = null;
            }
          }
        }
      }

      if (STATE.status === "STOPPING") {
        const allStopped = STATE.reels.every(r => !r.stopping);
        if (allStopped) {
          STATE.status = "IDLE";
          onStopFinished();
        }
      }
    }

    function getCenterSymbolIndex(reelIdx) {
      const n = STATE.images.length || 9;
      const r = STATE.reels[reelIdx];
      const topIndex = ((Math.floor(r.offset / SYMBOL_H) % n) + n) % n;
      return (topIndex + 1) % n; // center
    }

    // ----- FEVER / Result -----
    function getSymbolIdFromIndex(i) {
      return `SYM${i + 1}`;
    }

    function pickFeverTypeForSymbol(symbolId) {
      const list = STATE.config.feverTypes || [];
      const found = list.find(t => t.id === symbolId);
      return found || null;
    }

    function enterFever(type) {
      STATE.mode = "FEVER";
      STATE.currentFeverType = type;
      STATE.spinsLeft = STATE.config.fever.spins || 25;
      document.body.classList.add("fever-mode");
      setFeverLabel(type?.label || "FEVER!!", true);
      updateSpinCount();
      runFeverAmbientFX(type);
      startBgm(true, type?.bgm || STATE.config.audio?.bgmFever);
    }

    function exitFever() {
      STATE.mode = "NORMAL";
      STATE.currentFeverType = null;
      document.body.classList.remove("fever-mode");
      setFeverLabel("", false);
      clearFxLayer();
      startBgm(false, STATE.config.audio?.bgmNormal);
    }

    function maybeExtendFever() {
      const loop = STATE.config.fever?.loop;
      if (!loop) return;
      const chance = loop.chance ?? 0;
      const add = loop.addSpins ?? 0;
      if (Math.random() < chance) {
        STATE.spinsLeft += add;
        updateSpinCount();
        showMsg(`FEVER +${add}`, 650);
      }
    }

    function onStopFinished() {
      // compute result
      const a = getCenterSymbolIndex(0);
      const b = getCenterSymbolIndex(1);
      const c = getCenterSymbolIndex(2);

      const win = (a === b && b === c);

      if (win) {
        const symbolId = getSymbolIdFromIndex(a);

        // jackpot cut-in
        if (STATE.config.jackpot?.enabled && symbolId === (STATE.config.jackpot.symbolId || "SYM1")) {
          showJackpot();
        } else {
          showMsg("VITALIZATION!", 900);
        }

        if (STATE.mode === "FEVER") {
          runRandomFeverWinFX();
          maybeExtendFever();
        } else {
          // decide fever start
          const ft = pickFeverTypeForSymbol(symbolId) || STATE.config.feverTypes?.[0] || null;
          const startRate = STATE.config.fever?.startRate ?? 0.10;
          if (STATE.config.fever?.enabled && ft && Math.random() < startRate) {
            enterFever(ft);
          }
        }
      } else {
        if (STATE.mode !== "FEVER") showMsg("TRY AGAIN", 650);
      }

      // consume spins (in FEVER)
      if (STATE.mode === "FEVER") {
        STATE.spinsLeft = Math.max(0, STATE.spinsLeft - 1);
        updateSpinCount();
        if (STATE.spinsLeft <= 0) exitFever();
      }

      // auto continue
      if (STATE.auto) {
        setTimeout(() => spin(), 200);
      }
    }

    function showJackpot() {
      const overlay = UI.jackpotOverlay;
      const img = UI.jackpotImg;
      if (!overlay || !img) return;
      img.src = `/wip/games/celestial-slot/thumbs/${SLOT_ID}.png`;
      overlay.style.display = "flex";
      setTimeout(() => { overlay.style.display = "none"; }, 1200);
    }

    // ----- FX -----
    function clearFxLayer() {
      if (!UI.fxLayer) return;
      UI.fxLayer.innerHTML = "";
    }

    function runFeverAmbientFX(type) {
      clearFxLayer();
      const ambient = type?.ambientFx || [];
      ambient.forEach(name => spawnFx(name, true));
    }

    function runRandomFeverWinFX() {
      const type = STATE.currentFeverType;
      const winFx = type?.winFx || [];
      if (!winFx.length) return;

      const pick = winFx[randInt(0, winFx.length - 1)];
      spawnFx(pick, false);

      // restore ambient after a short time
      setTimeout(() => {
        if (STATE.mode === "FEVER" && STATE.currentFeverType) {
          runFeverAmbientFX(STATE.currentFeverType);
        }
      }, 900);
    }

    function spawnFx(name, persistent) {
      if (!UI.fxLayer) return;

      const el = document.createElement("div");
      el.className = `fx fx-${name}`;
      el.style.position = "absolute";
      el.style.inset = "0";
      el.style.pointerEvents = "none";

      // minimal fx styles
      if (name === "scanline") {
        el.style.background = "repeating-linear-gradient(to bottom, rgba(0,255,255,0.0), rgba(0,255,255,0.0) 6px, rgba(0,255,255,0.10) 7px)";
        el.style.mixBlendMode = "screen";
        el.style.animation = "scan 1.2s linear infinite";
      }
      if (name === "neonFrame") {
        el.style.border = "2px solid rgba(255,0,255,0.55)";
        el.style.boxShadow = "0 0 18px rgba(255,0,255,0.35), 0 0 22px rgba(0,255,255,0.20)";
        el.style.borderRadius = "12px";
        el.style.margin = "10px";
        el.style.animation = "pulse 1.4s ease-in-out infinite";
      }
      if (name === "burst") {
        el.style.background = "radial-gradient(circle at 50% 50%, rgba(255,255,0,0.30), rgba(255,0,255,0.00) 60%)";
        el.style.animation = "burst 0.85s ease-out 1";
      }
      if (name === "tripleZoom") {
        el.style.background = "radial-gradient(circle at 50% 50%, rgba(0,255,255,0.22), rgba(0,0,0,0.00) 55%)";
        el.style.animation = "zoom 0.85s ease-out 1";
      }
      if (name === "splitPanels") {
        el.style.background =
          "linear-gradient(90deg, rgba(255,0,255,0.25) 0 33%, rgba(0,255,255,0.18) 33% 66%, rgba(255,255,0,0.18) 66% 100%)";
        el.style.mixBlendMode = "screen";
        el.style.animation = "burst 0.75s ease-out 1";
      }
      if (name === "roulette") {
        el.style.background = "conic-gradient(from 0deg, rgba(255,0,255,0.25), rgba(0,255,255,0.25), rgba(255,255,0,0.22), rgba(255,0,255,0.25))";
        el.style.mixBlendMode = "screen";
        el.style.animation = "spin 0.9s linear 1";
      }

      UI.fxLayer.appendChild(el);

      if (!persistent) {
        setTimeout(() => { el.remove(); }, 900);
      }
    }

    // FX keyframes
    const fxStyle = document.createElement("style");
    fxStyle.textContent = `
      @keyframes scan { from { transform: translateY(-10%); } to { transform: translateY(10%); } }
      @keyframes pulse { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
      @keyframes burst { from { opacity: 0; transform: scale(.8); } 30% { opacity: 1; } to { opacity: 0; transform: scale(1.15); } }
      @keyframes zoom { from { opacity: 0; transform: scale(.9); } 40% { opacity: 1; } to { opacity: 0; transform: scale(1.3); } }
      @keyframes spin { from { opacity: .85; transform: rotate(0deg); } to { opacity: 0; transform: rotate(360deg); } }
    `;
    document.head.appendChild(fxStyle);

    // ----- Audio (simple) -----
    function ensureAudio() {
      if (STATE.audioReady) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        STATE.bgmCtx = ctx;
        STATE.bgmGain = ctx.createGain();
        STATE.bgmGain.gain.value = 0.35;
        STATE.bgmGain.connect(ctx.destination);
        STATE.audioReady = true;
      } catch (e) {
        console.warn("Audio init failed", e);
      }
    }

    async function startBgm(isFever, url) {
      if (!STATE.audioReady) return;
      // stop old
      if (STATE.bgmSource) {
        try { STATE.bgmSource.stop(); } catch {}
        STATE.bgmSource.disconnect?.();
        STATE.bgmSource = null;
      }

      // If url is wav file, fetch+decode (works on https). If fails, skip silently.
      if (!url) return;

      try {
        const res = await fetch(url);
        const arr = await res.arrayBuffer();
        const buf = await STATE.bgmCtx.decodeAudioData(arr);
        const src = STATE.bgmCtx.createBufferSource();
        src.buffer = buf;
        src.loop = true;
        src.connect(STATE.bgmGain);
        src.start();
        STATE.bgmSource = src;
      } catch (e) {
        console.warn("BGM load failed", url, e);
      }
    }

    function stopBgm() {
      if (STATE.bgmSource) {
        try { STATE.bgmSource.stop(); } catch {}
        STATE.bgmSource = null;
      }
    }

    // ----- Spin flow -----
    function spin() {
      if (STATE.status !== "IDLE") return;

      // prepare audio on user action
      ensureAudio();
      if (STATE.bgmCtx?.state === "suspended") STATE.bgmCtx.resume?.();

      // update UI label (FEVER label already handled)
      if (STATE.mode === "FEVER") {
        // keep label
      } else {
        setFeverLabel("", false);
      }

      // Start BGM if not playing
      if (!STATE.bgmSource) {
        startBgm(STATE.mode === "FEVER", (STATE.mode === "FEVER") ? (STATE.currentFeverType?.bgm || STATE.config.audio?.bgmFever) : STATE.config.audio?.bgmNormal);
      }

      // start reels
      STATE.status = "SPINNING";
      STATE.reels.forEach(r => { r.stopping = false; r.stopAt = null; });

      // auto stop sequence if no manual
      setTimeout(() => {
        if (STATE.status === "SPINNING") startStoppingSequence();
      }, 550);
    }

    function startStoppingSequence() {
      if (STATE.status !== "SPINNING") return;
      STATE.status = "STOPPING";

      // decide forced symbol index based on win roll
      const winRate = (STATE.mode === "FEVER") ? 1.0 : (STATE.config.winRate ?? 0.16);
      const isWin = Math.random() < winRate;

      if (isWin) {
        // choose a symbol index; in FEVER, avoid SYM1 override issues by not forcing it as "fever trigger" reset
        const n = STATE.images.length || 9;
        let idx = randInt(0, n - 1);
        STATE.forcedSymbolIndex = idx;
      } else {
        STATE.forcedSymbolIndex = null;
      }

      // stagger stops
      stopReel(0);
      setTimeout(() => stopReel(1), 160);
      setTimeout(() => stopReel(2), 320);
    }

    function stopReel(i) {
      const r = STATE.reels[i];
      if (!r) return;
      r.stopping = true;

      // compute target stop offset so center line matches forcedSymbolIndex if any
      const n = STATE.images.length || 9;
      const currentTop = ((Math.floor(r.offset / SYMBOL_H) % n) + n) % n;

      if (STATE.forcedSymbolIndex != null) {
        const forced = STATE.forcedSymbolIndex;
        // we want (top+1) == forced => top == forced-1
        const desiredTop = (forced - 1 + n) % n;

        // advance to desiredTop (forward only)
        let deltaSymbols = (desiredTop - currentTop + n) % n;
        // ensure at least a couple spins feel
        deltaSymbols += 2 * n;

        const target = Math.floor(r.offset / SYMBOL_H) * SYMBOL_H + deltaSymbols * SYMBOL_H;
        r.stopAt = target;
      } else {
        // random stop near next symbol boundary
        const base = Math.floor(r.offset / SYMBOL_H) * SYMBOL_H;
        const jitter = randInt(1, n + 3) * SYMBOL_H;
        r.stopAt = base + jitter;
      }
    }

    // ----- Controls -----
    function bindControls() {
      UI.spinBtn.addEventListener("click", spin);

      UI.stopBtns[0].addEventListener("click", () => { if (STATE.status === "SPINNING") startStoppingSequence(); });
      UI.stopBtns[1].addEventListener("click", () => { if (STATE.status === "SPINNING") startStoppingSequence(); });
      UI.stopBtns[2].addEventListener("click", () => { if (STATE.status === "SPINNING") startStoppingSequence(); });

      UI.autoBtn.addEventListener("click", () => {
        STATE.auto = !STATE.auto;
        UI.autoBtn.textContent = STATE.auto ? "AUTO: ON" : "AUTO: OFF";
        if (STATE.auto && STATE.status === "IDLE") spin();
      });

      UI.resetBtn.addEventListener("click", () => {
        STATE.auto = false;
        UI.autoBtn.textContent = "AUTO: OFF";
        exitFever();
        clearFxLayer();
        showMsg("RESET", 650);
      });

      UI.partnerSection.addEventListener("click", () => {
        const url = STATE.config.partnerUrl;
        if (url) window.open(url, "_blank", "noopener,noreferrer");
      });

      UI.celestialBtn.addEventListener("click", () => {
        const url = STATE.config.celestialUrl;
        if (url) window.open(url, "_blank", "noopener,noreferrer");
      });

      UI.musicBtn.addEventListener("click", () => {
        ensureAudio();
        if (STATE.bgmCtx?.state === "suspended") STATE.bgmCtx.resume?.();
        if (!STATE.bgmSource) {
          startBgm(STATE.mode === "FEVER", (STATE.mode === "FEVER") ? (STATE.currentFeverType?.bgm || STATE.config.audio?.bgmFever) : STATE.config.audio?.bgmNormal);
        }
        showMsg("MUSIC START", 600);
      });

      UI.musicStopBtn.addEventListener("click", () => {
        stopBgm();
        showMsg("MUSIC STOP", 600);
      });

      // click-layer to stop sequence in mobile
      $("#click-layer").addEventListener("pointerdown", () => {
        if (STATE.status === "SPINNING") startStoppingSequence();
      }, { passive: true });
    }

    // ----- Boot -----
    async function boot() {
      logBoot("> BOOT SEQUENCE STARTED...");
      STATE.config = EMBEDDED_CONFIG;
      applyTheme(STATE.config);
      initSideThumbs();
      logBoot("> Config loaded (embedded).");

      const sym = EMBEDDED_SYMBOLS?.symbols || [];
      STATE.symbols = sym.length ? sym : [];
      const imgs = await loadImages(STATE.symbols);
      const ok = imgs.filter(Boolean);

      if (ok.length >= 3) {
        STATE.images = ok;
        logBoot("> Images loaded.");
      } else {
        STATE.images = createDummySymbols(9);
        logBoot("> Images fallback (dummy).");
      }

      // init reel offsets
      STATE.reels.forEach(r => {
        r.offset = randInt(0, 8) * SYMBOL_H + randInt(0, SYMBOL_H - 1);
      });

      bindControls();
      render();
      logBoot("> SYSTEM READY.");
      showMsg("READY", 800);
    }

    // ----- Main loop -----
    function loop(now) {
      const dt = Math.min(0.05, (now - STATE.lastTick) / 1000);
      STATE.lastTick = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    // ----- iOS/Android viewport height fix -----
    (function () {
      function setVh() {
        document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
      }
      setVh();
      window.addEventListener('resize', setVh, { passive: true });
      window.addEventListener('orientationchange', setVh, { passive: true });
    })();

    boot().then(() => requestAnimationFrame(loop));
  </script>
</body>
