<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CELESTIAL SLOT UNIT</title>

  <style>
    :root {
      --theme-accent: #00ffff;
      --theme-bg: #000000;
      --theme-glow: 0 0 10px #00ffff;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* ===== STAGE LAYOUT ===== */
    .stage {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      box-sizing: border-box;
    }

    /* ===== SIDE THUMBS ===== */
    .side {
      width: min(420px, 26vw);
      height: min(900px, 94vh);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.92;
      pointer-events: none;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.75);
      background: rgba(0, 0, 0, 0.25);
    }

    .side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      filter: saturate(1.05) contrast(1.05);
      opacity: 0.80;
      transform: scale(1.02);
    }

    .side::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, rgba(0, 0, 0, 0.00), rgba(0, 0, 0, 0.55));
      z-index: 1;
      pointer-events: none;
    }

    /* ===== VERTICAL SLOT NAME ===== */
    .side-label {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-weight: 900;
      letter-spacing: 0.18em;
      font-size: clamp(22px, 2.6vw, 44px);
      color: rgba(255, 255, 255, 0.12);
      text-shadow:
        0 0 10px rgba(0, 255, 255, 0.30),
        0 0 30px rgba(0, 255, 255, 0.18),
        0 0 60px rgba(0, 0, 0, 0.85);
      user-select: none;
      white-space: nowrap;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.15));
    }

    .side.left .side-label {
      left: 10px;
    }

    .side.right .side-label {
      right: 10px;
    }

    @media (max-width: 1100px) {
      .side {
        display: none;
      }

      .stage {
        gap: 0;
        padding: 0;
      }
    }

    /* ===== GAME CONTAINER ===== */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      aspect-ratio: 9/16;
      background: var(--theme-bg);
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #333;
      overflow: hidden;
    }

    @media (min-aspect-ratio: 9/16) {
      #game-container {
        height: 95vh;
        width: auto;
      }
    }

    /* Screen Area */
    #screen {
      position: relative;
      width: 85%;
      height: 35%;
      margin-top: 15%;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid var(--theme-accent);
      box-shadow: var(--theme-glow), inset 0 0 20px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #reels-container {
      display: flex;
      width: 100%;
      height: 100%;
      justify-content: space-around;
      align-items: center;
    }

    .reel {
      width: 33%;
      height: 100%;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(10, 10, 10, 1);
      position: relative;
      overflow: hidden;
    }

    .reel canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Payline Reference - Center Row Highlight */
    #payline {
      position: absolute;
      top: 33.33%;
      left: 0;
      width: 100%;
      height: 33.33%;
      background: rgba(255, 255, 255, 0.05);
      border-top: 2px solid rgba(255, 0, 0, 0.3);
      border-bottom: 2px solid rgba(255, 0, 0, 0.3);
      pointer-events: none;
      z-index: 5;
    }

    /* UI Panel */
    #ui-panel {
      width: 90%;
      margin-top: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-grow: 1;
    }

    #machine-title {
      color: var(--theme-accent);
      text-shadow: 0 0 5px var(--theme-accent);
      margin: 0;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      order: -1;
      margin-bottom: 10px;
    }

    button {
      border: 1px solid var(--theme-accent);
      background: rgba(0, 50, 50, 0.5);
      color: white;
      padding: 5px 10px;
      font-size: 0.9rem;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      transition: all 0.1s;
      border-radius: 4px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: translateY(2px);
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #555;
      box-shadow: none;
    }

    /* Stop Buttons Row */
    #stop-controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .stop-btn {
      width: 30%;
      height: 50px;
      background: rgba(200, 50, 50, 0.2);
      border-color: #ff4444;
      color: #ffcccc;
      font-weight: bold;
      font-size: 1.0rem;
    }

    .stop-btn:not(:disabled):active {
      background: rgba(255, 0, 0, 0.8);
    }

    /* Main Actions */
    #main-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 80px;
    }

    #spin-btn,
    #seq-stop-btn {
      width: 100%;
      height: 100%;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 8px;
    }

    #spin-btn {
      background: rgba(0, 150, 150, 0.4);
      box-shadow: 0 0 15px var(--theme-accent);
    }

    #spin-btn:not(:disabled) {
      animation: pulse-glow 2s infinite;
    }

    #seq-stop-btn {
      background: rgba(150, 0, 0, 0.4);
      border-color: #ff8888;
      display: none;
      box-shadow: 0 0 15px #ff0000;
    }

    @keyframes pulse-glow {
      0% {
        box-shadow: 0 0 10px var(--theme-accent);
      }

      50% {
        box-shadow: 0 0 25px var(--theme-accent);
      }

      100% {
        box-shadow: 0 0 10px var(--theme-accent);
      }
    }

    /* Buttons Row */
    #meta-controls {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 5px;
      align-items: center;
    }

    .sys-btn {
      padding: 5px 12px;
      font-size: 0.7rem;
      background: rgba(30, 30, 30, 0.5);
      border-color: #666;
      color: #ccc;
      text-decoration: none;
    }

    .sys-btn:hover {
      color: #fff;
      background: rgba(50, 50, 50, 0.8);
      border-color: #888;
    }

    /* PARTNER CARD */
    #partner-section {
      margin-top: auto;
      padding: 15px;
      border: 1px solid var(--theme-accent);
      background: linear-gradient(90deg, rgba(0, 20, 20, 0.8), rgba(0, 40, 40, 0.9));
      cursor: pointer;
      text-align: left;
      position: relative;
      border-radius: 6px;
      transition: transform 0.2s;
    }

    #partner-section:active {
      transform: scale(0.98);
    }

    #partner-label {
      font-size: 0.7rem;
      color: var(--theme-accent);
      letter-spacing: 1px;
      opacity: 0.8;
      margin-bottom: 5px;
    }

    #partner-name {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
    }

    #partner-section::after {
      content: "➜";
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--theme-accent);
      font-size: 1.2rem;
    }

    #celestial-link {
      align-self: flex-end;
      margin-top: 10px;
      margin-bottom: 12px;
    }

    #message-box {
      position: absolute;
      top: 8%;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 1.5rem;
      text-shadow: 0 0 5px #000;
      pointer-events: none;
      z-index: 20;
      font-weight: bold;
    }

    /* init-log */
    #init-log {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.8);
      color: lime;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 10px;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 9999;
      display: none;
      white-space: pre-wrap;
    }

    /* Click layer for quick stop */
    #click-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      display: none;
    }

    /* LUKIA Subtitle */
    #subtitle-lukia {
      margin-top: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #00FFFF;
      text-shadow:
        0 0 2px #FFFFFF,
        0 0 8px #FFFFFF,
        0 0 15px #000000;
      letter-spacing: 2px;
      animation: erotic-pulse 3s ease-in-out infinite;
      font-family: 'Segoe UI', serif;
    }

    @keyframes erotic-pulse {

      0%,
      100% {
        opacity: 0.7;
        text-shadow: 0 0 2px #ea00ff, 0 0 5px #d000ff;
      }

      50% {
        opacity: 1.0;
        text-shadow: 0 0 5px #ea00ff, 0 0 15px #d000ff, 0 0 25px #ff00de;
      }
    }

    /* BGM Toggle Button */
    .bgm-btn {
      margin: 10px auto 0;
      display: block;
      padding: 8px 14px;
      font-size: 12px;
      letter-spacing: 0.08em;
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 255, 0.45);
      background: rgba(0, 0, 0, 0.55);
      color: rgba(0, 255, 255, 0.95);
      cursor: pointer;
      box-shadow: 0 0 14px rgba(0, 255, 255, 0.18);
      transition: all 0.2s ease;
    }

    .bgm-btn:hover {
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.28);
    }

    .bgm-btn.is-off {
      border-color: rgba(255, 0, 255, 0.45);
      color: rgba(255, 0, 255, 0.95);
      box-shadow: 0 0 14px rgba(255, 0, 255, 0.18);
    }

    /* AUTO Toggle */
    .auto-btn {
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 0, 255, 0.45);
      background: rgba(0, 0, 0, 0.55);
      color: rgba(255, 0, 255, 0.95);
      cursor: pointer;
      box-shadow: 0 0 14px rgba(255, 0, 255, 0.18);
      transition: all 0.2s ease;
      min-width: 120px;
      text-align: center;
    }

    .auto-btn.is-on {
      border-color: rgba(0, 255, 255, 0.45);
      color: rgba(0, 255, 255, 0.95);
      box-shadow: 0 0 14px rgba(0, 255, 255, 0.18);
    }

    /* Fever overlay */
    #fever-overlay {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4rem;
      font-weight: 900;
      color: #fff000;
      text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
      z-index: 60;
      display: none;
      pointer-events: none;
      white-space: nowrap;
    }

    /* Jackpot overlay (uses thumb image) */
    #jackpot-overlay {
      position: absolute;
      inset: 0;
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, rgba(255, 0, 255, 0.18), rgba(0, 0, 0, 0.88));
      pointer-events: none;
    }

    #jackpot-overlay .card {
      width: min(92%, 520px);
      border: 2px solid rgba(255, 0, 255, 0.55);
      box-shadow: 0 0 22px rgba(255, 0, 255, 0.28), inset 0 0 20px rgba(0, 0, 0, 0.65);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.45);
    }

    #jackpot-overlay img {
      width: 100%;
      height: auto;
      display: block;
      filter: saturate(1.05) contrast(1.05);
    }

    #jackpot-overlay .title {
      padding: 10px 14px;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: rgba(255, 0, 255, 0.95);
      text-shadow: 0 0 10px rgba(255, 0, 255, 0.30);
      font-size: 1.1rem;
      text-align: center;
    }

    /* Fever mode styling */
    .fever-mode #game-container {
      border: 2px solid rgba(255, 0, 255, 0.6);
      box-shadow: 0 0 15px rgba(255, 0, 255, 0.5), inset 0 0 20px rgba(255, 0, 255, 0.4);
      animation: neon-pulse 2.0s infinite alternate;
    }

    .fever-mode .reel {
      background: rgba(40, 0, 40, 0.8);
      border-color: rgba(255, 0, 255, 0.6);
    }

    @keyframes neon-pulse {
      from {
        box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
      }

      to {
        box-shadow: 0 0 25px rgba(255, 0, 255, 0.6), 0 0 5px rgba(255, 255, 255, 0.4);
      }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="side left">
      <img id="side-thumb-left" alt="slot thumb">
      <div class="side-label" id="side-label-left"></div>
    </div>

    <div id="game-container">
      <div id="init-log"></div>
      <div id="message-box">READY</div>
      <div id="fever-overlay">FEVER!!</div>

      <div id="screen">
        <div id="reels-container">
          <div class="reel" id="reel0"><canvas width="256" height="768"></canvas></div>
          <div class="reel" id="reel1"><canvas width="256" height="768"></canvas></div>
          <div class="reel" id="reel2"><canvas width="256" height="768"></canvas></div>
        </div>
        <div id="payline"></div>
        <div id="click-layer"></div>

        <!-- JACKPOT CUTIN (uses thumb/{slotId}.png) -->
        <div id="jackpot-overlay">
          <div class="card">
            <img id="jackpot-img" alt="JACKPOT">
            <div class="title">JACKPOT VITALIZATION</div>
          </div>
        </div>
      </div>

      <div id="ui-panel">
        <h2 id="machine-title">CELESTIAL SLOT</h2>

        <!-- Stop Buttons -->
        <div id="stop-controls">
          <button id="stop-0" class="stop-btn" onclick="stopReel(0)" disabled>STOP L</button>
          <button id="stop-1" class="stop-btn" onclick="stopReel(1)" disabled>STOP C</button>
          <button id="stop-2" class="stop-btn" onclick="stopReel(2)" disabled>STOP R</button>
        </div>

        <!-- Main Actions -->
        <div id="main-controls">
          <button id="seq-stop-btn" onclick="stopNext()" disabled>STOP</button>
          <button id="spin-btn" onclick="spin()">SPIN</button>
        </div>

        <div id="subtitle-lukia">~ SLOT ver ~</div>
        <button id="bgm-toggle" class="bgm-btn" type="button">⏸ MUSIC STOP</button>

        <div id="meta-controls">
          <button id="auto-toggle" class="auto-btn" type="button">AUTO: OFF</button>
          <button class="sys-btn" onclick="resetGame()">RESET SYSTEM</button>
        </div>

        <!-- Partner Card -->
        <div id="partner-section" onclick="goPartner()">
          <div id="partner-label">コラボ・提供者の方のページへ</div>
          <div id="partner-name">COLLAB</div>
        </div>

        <button id="celestial-link" class="sys-btn" onclick="goCelestial()">CELESTIAL Web Site</button>
      </div>
    </div>

    <div class="side right">
      <img id="side-thumb-right" alt="slot thumb">
      <div class="side-label" id="side-label-right"></div>
    </div>
  </div>

  <script>
    /**
     * CELESTIAL SLOT UNIT (CS-xxx TEMPLATE)
     * - Symbols: assets/slotimages/01_symbol.png ... 09_symbol.png
     * - Thumb + Profile/JACKPOT image: assets/thumb/{SLOTID}.png (shared)
     * - No prof_XX.png / fever_XX.png probing (avoid 404 storms)
     * - AUTO: continuous spins until OFF (even in FEVER)
     */

    const STATE = {
      config: null,
      images: [],
      reels: [
        { offset: 0, speed: 0, stopping: false, symbolIndex: 0, ctx: null },
        { offset: 0, speed: 0, stopping: false, symbolIndex: 0, ctx: null },
        { offset: 0, speed: 0, stopping: false, symbolIndex: 0, ctx: null }
      ],
      status: 'IDLE', // IDLE, SPINNING, RESULT
      mode: 'NORMAL', // NORMAL, FEVER
      feverCount: 0,
      winStreak: 0,
      forcedSymbol: null,

      // Audio
      audioCtx: null,
      bgmMuted: false,
      bgmAudio: null,
      bgmMode: 'NORMAL', // NORMAL, FEVER
      isBgmPlaying: false,

      // AUTO
      autoEnabled: false,
      autoTimers: [],

      // Assets
      slotId: 'UNKNOWN',
      thumbUrl: null,         // assets/thumb/{slotId}.png
      profileImageUrl: null   // same as thumbUrl (shared)
    };

    const VOLUMES = { SPIN: 0.1, STOP: 0.2, WIN: 0.1 };

    const DEFAULTS = {
      slotDisplayName: "",
      machineTitle: "CELESTIAL SLOT UNIT",
      partnerLabel: "コラボ・提供者の方のページへ",
      partnerName: "COLLAB",
      partnerUrl: "",
      celestialUrl: "https://celestial-observers.com",
      celestialButtonLabel: "CELESTIAL Web Site",
      theme: { accent: "#00ffff", bg: "#000000" },

      winRate: 0.08,
      feverRate: 0.10,

      // center-line 3-match symbol index (0..8) which guarantees FEVER + JACKPOT cutin
      jackpotSymbol: 0,

      fever: {
        enabled: true,
        spins: 10,
        winBoostInFever: 1.0
      },

      audio: {
        bgmNormal: "assets/audio/bgm_normal.wav",
        bgmFever: "assets/audio/bgm_fever.wav"
      }
    };

    const CANVAS_WIDTH = 256;
    const CANVAS_HEIGHT = 768;
    const SYMBOL_HEIGHT = 256;

    // Symbols fixed 9
    const AUTO_SYMBOLS = [
      "assets/slotimages/01_symbol.png",
      "assets/slotimages/02_symbol.png",
      "assets/slotimages/03_symbol.png",
      "assets/slotimages/04_symbol.png",
      "assets/slotimages/05_symbol.png",
      "assets/slotimages/06_symbol.png",
      "assets/slotimages/07_symbol.png",
      "assets/slotimages/08_symbol.png",
      "assets/slotimages/09_symbol.png"
    ];

    function log(msg) {
      console.log(msg);
      const el = document.getElementById('init-log');
      el.style.display = 'block';
      el.textContent += "> " + msg + "\n";
      setTimeout(() => {
        if (STATE.status === 'IDLE') el.style.display = 'none';
      }, 2500);
    }

    function getSlotIdFromPath() {
      const parts = location.pathname.split('/').filter(Boolean);
      // .../games/slot/CS-001/index.html -> CS-001
      return parts[parts.length - 2] || 'UNKNOWN';
    }

    function setSideLabels(text) {
      const t = (text || "").trim();
      const L = document.getElementById('side-label-left');
      const R = document.getElementById('side-label-right');
      if (L) L.textContent = t;
      if (R) R.textContent = t;
    }

    function mountThumbAndProfile() {
      STATE.slotId = getSlotIdFromPath();
      // Shared: side thumbs + profile/jackpot image
      const thumbUrl = `assets/thumb/${STATE.slotId}.png`;
      STATE.thumbUrl = thumbUrl;
      STATE.profileImageUrl = thumbUrl;

      const L = document.getElementById('side-thumb-left');
      const R = document.getElementById('side-thumb-right');

      function attach(img) {
        if (!img) return;
        img.src = thumbUrl;
        img.loading = "lazy";
        img.decoding = "async";
        img.referrerPolicy = "no-referrer";
        img.onerror = () => {
          const side = img.closest('.side');
          if (side) side.style.display = 'none';
        };
      }

      attach(L);
      attach(R);

      // jackpot overlay image
      const ji = document.getElementById('jackpot-img');
      if (ji) ji.src = STATE.profileImageUrl;
    }

    async function fetchWithTimeout(resource, timeout = 2000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(resource, { signal: controller.signal });
        clearTimeout(id);
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response;
      } catch (e) {
        clearTimeout(id);
        throw e;
      }
    }

    function currentConfig() {
      return STATE.config || DEFAULTS;
    }

    function applyConfig() {
      const c = currentConfig();

      document.title = c.machineTitle || DEFAULTS.machineTitle;
      const mt = document.getElementById('machine-title');
      if (mt) mt.textContent = c.machineTitle || DEFAULTS.machineTitle;

      // Theme
      const r = document.documentElement;
      const accent = (c.theme && c.theme.accent) ? c.theme.accent : DEFAULTS.theme.accent;
      const bg = (c.theme && c.theme.bg) ? c.theme.bg : DEFAULTS.theme.bg;
      r.style.setProperty('--theme-accent', accent);
      r.style.setProperty('--theme-bg', bg);
      r.style.setProperty('--theme-glow', `0 0 10px ${accent}`);

      // Partner
      const pl = document.getElementById('partner-label');
      const pn = document.getElementById('partner-name');
      if (pl) pl.textContent = c.partnerLabel || DEFAULTS.partnerLabel;
      if (pn) pn.textContent = c.partnerName || DEFAULTS.partnerName;

      // Celestial button label
      const cl = document.getElementById('celestial-link');
      if (cl) cl.textContent = c.celestialButtonLabel || DEFAULTS.celestialButtonLabel;

      // Slot display name (side + subtitle)
      const display = (c.slotDisplayName || "").trim();
      const sub = document.getElementById('subtitle-lukia');
      if (display) {
        setSideLabels(display);
        if (sub) sub.textContent = `~ ${display} ~`;
      } else {
        if (sub) setSideLabels(sub.textContent.replace(/^[~\s]+|[~\s]+$/g, ""));
      }

      // Ensure jackpot overlay image uses thumb (shared)
      const ji = document.getElementById('jackpot-img');
      if (ji) ji.src = STATE.profileImageUrl || `assets/thumb/${STATE.slotId}.png`;
    }

    async function loadImages(paths) {
      const loaded = await Promise.all(paths.map(path => new Promise(resolve => {
        const img = new Image();
        img.src = path;
        img.onload = () => resolve(img);
        img.onerror = () => {
          console.warn("Image Load Fail:", path);
          resolve(null);
        };
      })));

      const valid = loaded.filter(Boolean);
      if (valid.length < 3) throw new Error("Not enough valid symbol images");
      STATE.images = valid;
    }

    function initReels() {
      STATE.reels.forEach((r, i) => {
        const c = document.querySelector(`#reel${i} canvas`);
        r.ctx = c.getContext('2d');
        r.offset = Math.floor(Math.random() * STATE.images.length * SYMBOL_HEIGHT);
        r.speed = 0;
        r.stopping = false;
      });
      drawReels();
    }

    function setupInteractions() {
      const layer = document.getElementById('click-layer');
      const handleTap = (e) => { e.preventDefault(); stopNext(); };
      layer.addEventListener('mousedown', handleTap);
      layer.addEventListener('touchstart', handleTap, { passive: false });
    }

    function goPartner() {
      const url = currentConfig().partnerUrl;
      if (url) window.open(url, '_blank');
    }

    function goCelestial() {
      const url = currentConfig().celestialUrl || DEFAULTS.celestialUrl;
      window.open(url, '_blank');
    }

    // ===== BGM =====
    function initAudio() {
      if (!STATE.audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) STATE.audioCtx = new AC();
      }
      if (STATE.audioCtx && STATE.audioCtx.state === 'suspended') {
        STATE.audioCtx.resume();
      }

      if (!STATE.bgmAudio) {
        const c = currentConfig();
        const src = (c.audio && c.audio.bgmNormal) ? c.audio.bgmNormal : DEFAULTS.audio.bgmNormal;
        STATE.bgmAudio = new Audio(src);
        STATE.bgmAudio.loop = true;
        STATE.bgmAudio.volume = 0.30;
        STATE.isBgmPlaying = false;
        STATE.bgmMode = 'NORMAL';
        console.log("BGM Initialized:", src);
      }
    }

    function ensureBGM() {
      if (STATE.bgmMuted) return;
      if (!STATE.bgmAudio) return;
      if (STATE.isBgmPlaying) return;

      STATE.bgmAudio.play().then(() => {
        STATE.isBgmPlaying = true;
      }).catch(e => {
        console.warn("BGM blocked (needs interaction):", e);
      });
    }

    function stopBGM() {
      if (STATE.bgmAudio) {
        try { STATE.bgmAudio.pause(); } catch (e) { }
      }
      STATE.isBgmPlaying = false;
    }

    function startBGM() {
      if (STATE.bgmMuted) return;
      ensureBGM();
    }

    function setBGMMode(mode) {
      const c = currentConfig();
      const normalSrc = (c.audio && c.audio.bgmNormal) ? c.audio.bgmNormal : DEFAULTS.audio.bgmNormal;
      const feverSrc = (c.audio && c.audio.bgmFever) ? c.audio.bgmFever : DEFAULTS.audio.bgmFever;

      const next = (mode === 'FEVER') ? feverSrc : normalSrc;
      if (!STATE.bgmAudio) return;

      // same file? skip
      if (STATE.bgmAudio.src && STATE.bgmAudio.src.endsWith(next)) {
        STATE.bgmMode = mode;
        return;
      }

      const wasPlaying = STATE.isBgmPlaying && !STATE.bgmAudio.paused;
      try { STATE.bgmAudio.pause(); } catch (e) { }
      STATE.isBgmPlaying = false;

      STATE.bgmAudio = new Audio(next);
      STATE.bgmAudio.loop = true;
      STATE.bgmAudio.volume = 0.30;
      STATE.bgmMode = mode;

      if (wasPlaying && !STATE.bgmMuted) {
        ensureBGM();
      }
    }

    function setupBgmToggle() {
      const btn = document.getElementById('bgm-toggle');
      if (!btn) return;

      const sync = () => {
        if (STATE.bgmMuted) {
          btn.classList.add('is-off');
          btn.textContent = '▶ MUSIC PLAY';
        } else {
          btn.classList.remove('is-off');
          btn.textContent = '⏸ MUSIC STOP';
        }
      };

      sync();

      btn.addEventListener('click', () => {
        STATE.bgmMuted = !STATE.bgmMuted;
        if (STATE.bgmMuted) stopBGM();
        else startBGM();
        sync();
      });
    }

    // ===== AUTO =====
    function clearAutoTimers() {
      STATE.autoTimers.forEach(id => clearTimeout(id));
      STATE.autoTimers = [];
    }

    function setAutoEnabled(enabled) {
      STATE.autoEnabled = !!enabled;
      clearAutoTimers();
      updateAutoButton();

      if (STATE.autoEnabled) {
        scheduleNextAutoSpin(200);
      }
    }

    function updateAutoButton() {
      const btn = document.getElementById('auto-toggle');
      if (!btn) return;

      if (STATE.autoEnabled) {
        btn.classList.add('is-on');
        btn.textContent = "AUTO: ON";
      } else {
        btn.classList.remove('is-on');
        btn.textContent = "AUTO: OFF";
      }
    }

    function setupAutoToggle() {
      const btn = document.getElementById('auto-toggle');
      if (!btn) return;
      updateAutoButton();

      btn.addEventListener('click', () => {
        setAutoEnabled(!STATE.autoEnabled);
      });
    }

    function scheduleNextAutoSpin(delayMs = 650) {
      if (!STATE.autoEnabled) return;
      if (!(STATE.status === 'IDLE' || STATE.status === 'RESULT')) return;

      const id = setTimeout(() => {
        if (!STATE.autoEnabled) return;
        if (!(STATE.status === 'IDLE' || STATE.status === 'RESULT')) return;
        spin();
      }, delayMs);

      STATE.autoTimers.push(id);
    }

    function scheduleAutoStops() {
      if (!STATE.autoEnabled) return;
      // L -> C -> R
      const t0 = setTimeout(() => { if (STATE.autoEnabled) stopReel(0); }, 520);
      const t1 = setTimeout(() => { if (STATE.autoEnabled) stopReel(1); }, 820);
      const t2 = setTimeout(() => { if (STATE.autoEnabled) stopReel(2); }, 1120);
      STATE.autoTimers.push(t0, t1, t2);
    }

    // ===== GAME =====
    function resetGame() {
      // Reset cancels AUTO (so it won't instantly re-spin)
      setAutoEnabled(false);

      STATE.status = 'IDLE';
      STATE.mode = 'NORMAL';
      STATE.feverCount = 0;
      STATE.winStreak = 0;
      STATE.forcedSymbol = null;

      document.body.classList.remove('fever-mode');

      // Hide overlays
      hideFeverOverlay();
      hideJackpotOverlay();

      STATE.reels.forEach(r => {
        r.speed = 0;
        r.stopping = false;
        r.offset = Math.floor(Math.random() * STATE.images.length * SYMBOL_HEIGHT);
      });

      document.getElementById('message-box').textContent = "READY";
      document.getElementById('spin-btn').style.display = 'block';
      document.getElementById('seq-stop-btn').style.display = 'none';
      document.getElementById('spin-btn').disabled = false;

      [0, 1, 2].forEach(i => document.getElementById(`stop-${i}`).disabled = true);
      document.getElementById('click-layer').style.display = 'none';

      // BGM back to normal (don’t force play if muted)
      setBGMMode('NORMAL');
      applyConfig();
      drawReels();
    }

    function spin() {
      if (!(STATE.status === 'IDLE' || STATE.status === 'RESULT')) return;

      initAudio();
      if (STATE.audioCtx && STATE.audioCtx.state === 'suspended') STATE.audioCtx.resume();
      if (!STATE.bgmMuted) ensureBGM();

      // If fever: decrement counter
      if (STATE.mode === 'FEVER') {
        STATE.feverCount--;
        showFeverOverlay(`FEVER!! (${STATE.feverCount})`);
        document.getElementById('message-box').textContent = `FEVER! ${STATE.feverCount} LEFT`;
      } else {
        hideFeverOverlay();
        document.getElementById('message-box').textContent = "SPINNING...";
      }

      playTone('spin');

      STATE.status = 'SPINNING';
      STATE.forcedSymbol = null;

      // Decide win forcing
      const c = currentConfig();
      let currentWinRate = (c.winRate ?? DEFAULTS.winRate);
      if (STATE.mode === 'FEVER') {
        const f = c.fever || DEFAULTS.fever;
        currentWinRate = (f.winBoostInFever ?? 1.0);
      }

      const willWin = Math.random() < currentWinRate;
      if (willWin) {
        const symCount = STATE.images.length;
        STATE.forcedSymbol = Math.floor(Math.random() * symCount);
      }

      // UI states
      document.getElementById('spin-btn').style.display = 'none';
      document.getElementById('seq-stop-btn').style.display = 'block';
      document.getElementById('seq-stop-btn').disabled = false;
      document.getElementById('click-layer').style.display = 'block';
      [0, 1, 2].forEach(i => document.getElementById(`stop-${i}`).disabled = false);

      // Start reels
      STATE.reels.forEach(r => {
        r.speed = 40 + Math.random() * 5;
        r.stopping = false;
      });

      // If auto: schedule stop sequence
      scheduleAutoStops();
    }

    function stopReel(idx) {
      if (STATE.status !== 'SPINNING') return;
      const r = STATE.reels[idx];
      if (r.speed > 0 && !r.stopping) {
        r.stopping = true;
        playTone('stop');
        document.getElementById(`stop-${idx}`).disabled = true;
      }
    }

    function stopNext() {
      const idx = STATE.reels.findIndex(r => r.speed > 0 && !r.stopping);
      if (idx !== -1) stopReel(idx);
    }

    function renderLoop() {
      updatePhysics();
      drawReels();
      requestAnimationFrame(renderLoop);
    }

    function updatePhysics() {
      if (STATE.status !== 'SPINNING') return;

      let moving = 0;
      const totalH = STATE.images.length * SYMBOL_HEIGHT;

      STATE.reels.forEach(r => {
        if (r.speed > 0) {
          moving++;
          r.offset += r.speed;
          if (r.offset >= totalH) r.offset -= totalH;

          if (r.stopping) {
            let targetIdx = 0;

            if (STATE.forcedSymbol !== null) {
              // Put forced symbol on CENTER row -> targetIdx should align so center is forced
              // We store symbolIndex as top-row index, so for center we want top = forced - 1
              let desiredTop = STATE.forcedSymbol - 1;
              if (desiredTop < 0) desiredTop += STATE.images.length;
              targetIdx = desiredTop;
            } else {
              const currentIndex = Math.floor(r.offset / SYMBOL_HEIGHT);
              targetIdx = (currentIndex + 1) % STATE.images.length;
            }

            const targetOffset = targetIdx * SYMBOL_HEIGHT;
            r.offset = targetOffset;
            r.speed = 0;
            r.stopping = false;
            r.symbolIndex = targetIdx;
          }
        }
      });

      if (moving === 0) {
        STATE.status = 'RESULT';
        checkResult();
      }
    }

    function getCenterSymbolIndex(reelIdx) {
      const r = STATE.reels[reelIdx];
      // symbolIndex is top row, center row is +1
      return (r.symbolIndex + 1) % STATE.images.length;
    }

    function checkResult() {
      document.getElementById('click-layer').style.display = 'none';
      document.getElementById('seq-stop-btn').style.display = 'none';
      document.getElementById('spin-btn').style.display = 'block';
      document.getElementById('spin-btn').disabled = false;

      const c0 = getCenterSymbolIndex(0);
      const c1 = getCenterSymbolIndex(1);
      const c2 = getCenterSymbolIndex(2);

      console.log(`Result(center): ${c0}-${c1}-${c2}`);

      const conf = currentConfig();
      const feverConf = conf.fever || DEFAULTS.fever;

      if (c0 === c1 && c1 === c2) {
        // WIN
        playTone('win');

        const jackpotSymbol = (conf.jackpotSymbol ?? DEFAULTS.jackpotSymbol);

        if (conf.feverRate == null) conf.feverRate = DEFAULTS.feverRate;
        if (conf.winRate == null) conf.winRate = DEFAULTS.winRate;

        // JACKPOT: guaranteed fever + big cutin
        const isJackpot = (c0 === jackpotSymbol);

        if (isJackpot) {
          showJackpotOverlay(1800);
          if (feverConf.enabled) {
            startFever(true);
          } else {
            document.getElementById('message-box').textContent = "JACKPOT!";
          }
        } else {
          // Normal win: chance to trigger fever
          const willFever = feverConf.enabled && (Math.random() < (conf.feverRate ?? DEFAULTS.feverRate));

          if (willFever && STATE.mode === 'NORMAL') {
            startFever(false);
          } else {
            document.getElementById('message-box').textContent = "VITALIZATION!";
          }
        }

      } else {
        // LOSE
        if (STATE.mode === 'NORMAL') {
          document.getElementById('message-box').textContent = "TRY AGAIN";
        } else {
          document.getElementById('message-box').textContent = "";
        }
        hideJackpotOverlay();
      }

      // FEVER end check
      if (STATE.mode === 'FEVER' && STATE.feverCount <= 0) {
        setTimeout(endFever, 900);
      }

      // AUTO continuation
      if (STATE.autoEnabled) {
        scheduleNextAutoSpin(650);
      }
    }

    function startFever(fromJackpot) {
      STATE.mode = 'FEVER';
      const f = currentConfig().fever || DEFAULTS.fever;
      STATE.feverCount = (f.spins ?? 10);

      document.body.classList.add('fever-mode');
      showFeverOverlay(`FEVER!! (${STATE.feverCount})`);

      document.getElementById('message-box').textContent = fromJackpot ? "JACKPOT FEVER!!" : "FEVER!!";
      setBGMMode('FEVER');
    }

    function endFever() {
      STATE.mode = 'NORMAL';
      document.body.classList.remove('fever-mode');
      hideFeverOverlay();
      document.getElementById('message-box').textContent = "READY";
      setBGMMode('NORMAL');

      // AUTO continues naturally (scheduleNextAutoSpin is called on RESULT)
    }

    function showFeverOverlay(text) {
      const overlay = document.getElementById('fever-overlay');
      overlay.textContent = text || "FEVER!!";
      overlay.style.display = 'block';
    }

    function hideFeverOverlay() {
      const overlay = document.getElementById('fever-overlay');
      overlay.style.display = 'none';
    }

    function showJackpotOverlay(duration = 1500) {
      const el = document.getElementById('jackpot-overlay');
      const img = document.getElementById('jackpot-img');
      if (img) img.src = STATE.profileImageUrl || `assets/thumb/${STATE.slotId}.png`;

      el.style.display = 'flex';
      setTimeout(() => {
        hideJackpotOverlay();
      }, duration);
    }

    function hideJackpotOverlay() {
      const el = document.getElementById('jackpot-overlay');
      el.style.display = 'none';
    }

    function drawReels() {
      const total = STATE.images.length;
      STATE.reels.forEach(r => {
        const ctx = r.ctx;
        if (!ctx) return;

        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        const baseIdx = Math.floor(r.offset / SYMBOL_HEIGHT);
        const shiftY = -(r.offset % SYMBOL_HEIGHT);

        for (let i = -1; i < 4; i++) {
          let idx = (baseIdx + i) % total;
          if (idx < 0) idx += total;

          const img = STATE.images[idx];
          const y = shiftY + (i * SYMBOL_HEIGHT);
          if (!img) continue;

          try {
            const side = Math.min(img.width, img.height);
            const sx = (img.width - side) / 2;
            const sy = (img.height - side) / 2;
            ctx.drawImage(img, sx, sy, side, side, 0, y, CANVAS_WIDTH, SYMBOL_HEIGHT);
          } catch (e) {
            ctx.fillStyle = '#f00';
            ctx.fillRect(0, y, CANVAS_WIDTH, SYMBOL_HEIGHT);
          }
        }
      });
    }

    // ===== SFX (synth) =====
    function playTone(type) {
      if (!STATE.audioCtx) return;

      const ctx = STATE.audioCtx;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.connect(gain);
      gain.connect(ctx.destination);

      const now = ctx.currentTime;

      if (type === 'spin') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(VOLUMES.SPIN, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'stop') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        gain.gain.setValueAtTime(VOLUMES.STOP, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'win') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        osc.frequency.setValueAtTime(1046.50, now + 0.3);

        gain.gain.setValueAtTime(VOLUMES.WIN, now);
        gain.gain.linearRampToValueAtTime(VOLUMES.WIN, now + 0.4);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 1.0);

        osc.start(now);
        osc.stop(now + 1.0);
      }
    }

    // ===== BOOT =====
    async function boot() {
      log("BOOT SEQUENCE STARTED...");

      // Mount assets (thumb is shared for side + profile/jackpot)
      mountThumbAndProfile();

      // Load config (optional)
      try {
        const res = await fetchWithTimeout('config.json', 2000);
        STATE.config = await res.json();
        log("Config loaded.");
      } catch (e) {
        STATE.config = DEFAULTS;
        log("Config failed (" + (e && e.name ? e.name : "ERR") + "). Using Defaults.");
      }

      applyConfig();

      // Load symbol images
      try {
        await loadImages(AUTO_SYMBOLS);
        log("Images loaded.");
      } catch (e) {
        log("Images failed. Check assets/slotimages/01_symbol.png...09_symbol.png");
        // If critical, still allow with blank images (but draw will fail). Better to stop here:
        console.error(e);
      }

      initReels();
      setupInteractions();
      setupBgmToggle();
      setupAutoToggle();

      log("SYSTEM READY.");
      requestAnimationFrame(renderLoop);
    }

    window.onload = boot;
  </script>
</body>
